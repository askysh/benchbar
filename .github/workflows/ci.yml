# CI for BenchBar: the CLI tests and lint on Linux, in a bash 3.2 container and
# on macOS, the app build and Swift tests on macOS, and an unsigned release
# bundle you can download from the run to try the app without a GitHub release.
#
# Tiers (docs/DECISIONS.md, "CI tiering"). The "changes" job runs
# scripts/ci-plan.sh, which decides every other job from the changed files:
#   pull request   the tests tests/affected.sh picks, on Linux (bash 5) and in
#                  the bash 3.2 container, in as many shards as their weight
#                  needs. macOS runs only when a path that needs it changed
#                  (BSD tools, launchd, the Keychain, pf, the installers: the
#                  macos_paths list in the script) or the label test-macos is
#                  on, and the app only for macos/ and its scripts. A change
#                  to the harness, the mocks, run-tests.sh, affected.sh, the
#                  entry point, templates, config, the phases or this file
#                  runs everything everywhere.
#   push to main or next-release, and the nightly
#                  everything everywhere, the real install and the Windows
#                  jobs too (a push that changes only docs, site or *.md skips
#                  them)
#   workflow_dispatch
#                  the inputs "tests" and "legs" pick a subset
# "CI result" needs every other job and is the one required check: it fails
# when any of them failed or was cancelled, and a skipped job is fine.
#
# The app job runs on macos-26: the project uses Xcode 26 build settings
# (default MainActor isolation, approachable concurrency) that older Xcode
# versions do not know. The CLI jobs run on macos-latest, where /bin/bash
# is the same 3.2 the CLI targets.
#
# Speed (docs/DECISIONS.md, "CI speed" and "CI tiering"): the shards of a leg
# are balanced from the per test seconds in tests/run-tests.sh
# (scripts/ci-timings.sh regenerates them from a run) and sized to about 150
# seconds each; shellcheck is its own Linux job and checks only the changed
# files on a pull request, in parallel; the macOS and bash 3.2 shards leave
# out the tests of the Linux platform layer, which the Linux shards run on the
# bash Linux users have; the release bundle is built in the app job from the
# same checkout and DerivedData instead of a second job.
#
# The Windows shim (windows/shim, Go) is vetted, tested and built for
# windows/amd64 and windows/arm64 on Linux in the "shim" job; the "wsl" job
# runs its tests on Windows and against a real WSL distro on a GitHub hosted
# Windows runner.
#
# A job that has nothing to do is skipped as a whole (a skipped job passes
# "CI result"), so a pull request that changes only docs starts no macOS job
# and a Swift only one starts no CLI shard. The docs site has its own
# workflow, docs.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main, next-release]
  schedule:
    # the nightly: the whole suite on every platform, so runner image drift
    # shows without a pull request. GitHub runs a schedule from the default
    # branch (main, the last release), so the jobs check out next-release
    # themselves (the "ref" of each checkout) to test what is about to ship
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      tests:
        description: 'Test names to run, space separated (empty: the whole suite). Example: "test-run-lock test-lock"'
        required: false
        default: ''
      legs:
        description: 'Legs to run, space separated, from: linux bash32 macos shellcheck app shim real (empty: all; with tests: linux bash32)'
        required: false
        default: ''

permissions:
  contents: read

# One run per pull request: a push to the branch cancels the run before it.
# The group has the pull request number, not the ref, so a pull request run
# and the push run after its merge never cancel each other. A push to
# next-release or main is never cancelled: a full run per merge must finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # only a pull request's older run is stale; a push to next-release or main must finish (a full run per merge)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
      full: ${{ steps.plan.outputs.full }}
      tests: ${{ steps.plan.outputs.tests }}
      linux_skip: ${{ steps.plan.outputs.linux_skip }}
      linux_n: ${{ steps.plan.outputs.linux_n }}
      linux_shards: ${{ steps.plan.outputs.linux_shards }}
      bash32_skip: ${{ steps.plan.outputs.bash32_skip }}
      bash32_n: ${{ steps.plan.outputs.bash32_n }}
      bash32_shards: ${{ steps.plan.outputs.bash32_shards }}
      macos_skip: ${{ steps.plan.outputs.macos_skip }}
      macos_n: ${{ steps.plan.outputs.macos_n }}
      macos_shards: ${{ steps.plan.outputs.macos_shards }}
      shellcheck: ${{ steps.plan.outputs.shellcheck }}
      shellcheck_files: ${{ steps.plan.outputs.shellcheck_files }}
      app: ${{ steps.plan.outputs.app }}
      shim: ${{ steps.plan.outputs.shim }}
      wsl: ${{ steps.plan.outputs.wsl }}
      real: ${{ steps.plan.outputs.real }}
    steps:
      # the whole history: the plan diffs against the pull request's base, and
      # affected.sh names the functions a change touched
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'next-release' || github.sha }}
          fetch-depth: 0

      # Everything from the event goes in through env, never into the script text
      - name: Plan the run (scripts/ci-plan.sh)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          INPUT_TESTS: ${{ inputs.tests }}
          INPUT_LEGS: ${{ inputs.legs }}
        run: |
          PLAN_SUMMARY="$GITHUB_STEP_SUMMARY" bash scripts/ci-plan.sh >"$RUNNER_TEMP/plan.out"
          cat "$RUNNER_TEMP/plan.out"
          cat "$RUNNER_TEMP/plan.out" >>"$GITHUB_OUTPUT"

  # The shards are a matrix the plan sizes (an empty one skips the job as a
  # whole). Every leg runs its shard of the tests: run-tests.sh SHARD=I/N,
  # PARALLEL at a time, the tests named in ONLY_TESTS or all of them, minus
  # the tests the platform leaves out (SKIP_TESTS, from the plan).
  # Four of the macOS jobs plus the app job are the five concurrent macOS jobs
  # of the free plan, so macOS stays the exception on a pull request.
  cli-macos:
    name: CLI tests (macOS, shard ${{ matrix.shard }}/${{ needs.changes.outputs.macos_n }})
    needs: changes
    if: needs.changes.outputs.macos_n != '0'
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.macos_shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'next-release' || github.sha }}

      - name: Versions
        run: |
          /bin/bash --version | head -n 1
          sysctl -n hw.ncpu

      - name: TEMP debug process groups
        run: /bin/bash scripts/ci-debug-pg.sh </dev/null 2>&1 || true

      # run-tests.sh runs its share of the tests PARALLEL (the CPU count) at a
      # time; the Linux platform tests run in the Linux shards
      - name: CLI tests (macOS /bin/bash 3.2)
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.macos_n }}
          ONLY_TESTS: ${{ needs.changes.outputs.tests }}
          SHELLCHECK: '0'
          SKIP_TESTS: ${{ needs.changes.outputs.macos_skip }}
        run: /bin/bash tests/run-tests.sh

  # The mocked suite on Linux, for the Linux platform layer
  # (docs/DECISIONS.md, "Linux"). The LAN share and its guard are macOS only
  # (pf, launchd, the Keychain), so the plan leaves them out here.
  cli-linux:
    name: CLI tests (Linux, shard ${{ matrix.shard }}/${{ needs.changes.outputs.linux_n }})
    needs: changes
    if: needs.changes.outputs.linux_n != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.linux_shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'next-release' || github.sha }}

      - name: Versions
        run: |
          bash --version | head -n 1
          nproc

      - name: CLI tests (Linux bash)
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.linux_n }}
          ONLY_TESTS: ${{ needs.changes.outputs.tests }}
          SHELLCHECK: '0'
          SKIP_TESTS: ${{ needs.changes.outputs.linux_skip }}
        run: bash tests/run-tests.sh

  # The mocked suite under bash 3.2.57, the bash of macOS, on cheap Linux
  # runners: the bash-ism risk (a 4.x feature that /bin/bash on a Mac does
  # not have) no longer needs a macOS runner. The image is Alpine, where
  # JavaScript actions such as checkout do not run, so the checkout happens
  # on the runner and the suite runs through docker run.
  cli-bash32:
    name: CLI tests (bash 3.2, shard ${{ matrix.shard }}/${{ needs.changes.outputs.bash32_n }})
    needs: changes
    if: needs.changes.outputs.bash32_n != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.bash32_shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'next-release' || github.sha }}

      # Packages, each for what the suite runs that busybox does not do the
      # GNU way: coreutils (stat -c, date, mktemp, timeout), findutils (find),
      # diffutils (cmp, diff), grep, sed and gawk (the GNU behaviour the Linux
      # layer is written for), procps (ps -eo for run-tests.sh's deadline),
      # git (test-affected's fake repository, the bench init clone), python3
      # (jget and the JSON checks), zip and unzip (the report and packaging
      # tests), curl (install.sh's test), perl-utils (shasum, which the
      # harness uses for the wkhtmltopdf checksum), musl-locales (locale -a
      # and C.UTF-8, for test-status-cost's UTF-8 leg). The mocks start with
      # #!/bin/bash, which the image only has as /usr/local/bin/bash. The
      # suite runs as a user, not root, from a copy in that user's home, so
      # no uid has to match the runner's and nothing is written back. The
      # user is "ci": test-report's sample log holds the word "tester",
      # which the report would redact as a username. The image pull and the
      # package download retry: Docker Hub and the Alpine mirrors are the
      # flake sources of this job.
      - name: CLI tests (bash 3.2.57 container)
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.bash32_n }}
          ONLY_TESTS: ${{ needs.changes.outputs.tests }}
          SHELLCHECK: '0'
          SKIP_TESTS: ${{ needs.changes.outputs.bash32_skip }}
        run: |
          for attempt in 1 2 3; do docker pull -q bash:3.2.57 >/dev/null && break; [ "$attempt" = 3 ] && exit 1; sleep 5; done
          docker run --rm -v "$PWD:/w:ro" -e SHARD -e SHELLCHECK -e SKIP_TESTS -e ONLY_TESTS bash:3.2.57 sh -euc '
            for attempt in 1 2 3; do
              apk add --no-cache coreutils findutils diffutils grep sed gawk procps git python3 zip unzip curl perl-utils musl-locales >/dev/null && break
              [ "$attempt" = 3 ] && exit 1
              sleep 5
            done
            ln -sf /usr/local/bin/bash /bin/bash
            adduser -D ci
            cp -R /w /home/ci/w && chown -R ci /home/ci/w
            su ci -s /bin/sh -c "cd /home/ci/w && export HOME=/home/ci && git config --global --add safe.directory \"*\" && bash --version | head -n 1 && nproc && bash tests/run-tests.sh"
          '

  # shellcheck once, on its own runner, for every platform's scripts: the files
  # a pull request changed (the plan lists them), every file on a full run. It
  # runs one shellcheck process per 12 files, one per CPU at a time.
  shellcheck:
    name: shellcheck
    needs: changes
    if: needs.changes.outputs.shellcheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'next-release' || github.sha }}

      # Homebrew's 0.11.0, the version contributors run on a Mac: Ubuntu's
      # apt package is older and reports findings 0.11.0 does not. The binary
      # for this runner's CPU, each with its checksum.
      - name: Install shellcheck 0.11.0
        run: |
          case "$(uname -m)" in
            x86_64) arch=x86_64; sum=4da528ddb3a4d1b7b24a59d4e16eb2f5fd960f4bd9a3708a15baddbdf1d5a55b ;;
            aarch64) arch=aarch64; sum=127f13925eadd52c341bca0ebaf9ab0dbd78c6468f30a8f262a528bf8de47546 ;;
            *) echo "no shellcheck binary pinned for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/sc.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.$arch.tar.xz"
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          echo "$sum  $RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" | sha256sum -c -
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >>"$GITHUB_PATH"

      - name: shellcheck
        env:
          SHELLCHECK_FILES: ${{ needs.changes.outputs.shellcheck_files }}
        run: |
          shellcheck --version | sed -n 2p
          bash tests/run-tests.sh shellcheck

  # A real install on Linux: phase 00 from apt, uv and fnm, a v15 bench and
  # site, the bench under systemd --user, up, the site answering, status and
  # doctor, down. Slow (a bench build), so only on pushes, the nightly, a
  # dispatch that asks for it and pull requests labelled test-linux (the plan
  # says; a push that changes only docs, site or *.md skips it). GitHub's
  # Ubuntu runners boot systemd, but the runner user has no user manager until
  # linger starts one (docs/DECISIONS.md, "Linux").
  cli-linux-real:
    name: Real install (Linux, v15, systemd --user)
    needs: changes
    if: needs.changes.outputs.real == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ADMIN_PASSWORD: admin-ci-only
      SITE: linuxdev.localhost
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'next-release' || github.sha }}

      # The image ships MySQL (stopped) and its /etc/mysql: mariadb-server
      # cannot install over them. A throwaway VM, so purging is safe here.
      - name: Remove the image's MySQL
        run: |
          sudo systemctl stop mysql 2>/dev/null || true
          sudo apt-get purge -y 'mysql-*' >/dev/null
          sudo rm -rf /etc/mysql /var/lib/mysql

      - name: Start a systemd user manager for the runner user
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >>"$GITHUB_ENV"
          for _ in $(seq 1 20); do
            XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user is-system-running 2>/dev/null && break
            sleep 1
          done
          XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user is-system-running || true

      - name: benchbar install --yes
        run: ./benchbar install --yes --site "$SITE"

      - name: A second install is unchanged
        run: ./benchbar install --yes --site "$SITE" 2>&1 | tee "$RUNNER_TEMP/second.log"

      - name: benchbar up and wait for the site
        run: |
          ./benchbar up
          for _ in $(seq 1 90); do
            curl -fsS "http://$SITE:8000/api/method/ping" && exit 0
            sleep 2
          done
          ./benchbar status --json || true
          tail -n 100 ~/frappe-bench/logs/bench.log || true
          exit 1

      # 0.9.0: the dev web server and socketio listen on 127.0.0.1 only (issue 117)
      - name: The web server and socketio listen on loopback only
        run: |
          ss -Hltn
          rows="$(ss -Hltn '( sport = :8000 or sport = :9000 )' | awk '{print $4}')"
          test "$(printf '%s\n' "$rows" | grep -c .)" -ge 2 || { echo "expected a listener on 8000 and 9000"; exit 1; }
          bad="$(printf '%s\n' "$rows" | grep -v '^127\.0\.0\.1:' || true)"
          test -z "$bad" || { echo "not on loopback: $bad"; exit 1; }
          ./benchbar doctor --json | python3 -c 'import json,sys; d=json.load(sys.stdin); c=[x for x in d["checks"] if x["id"] == "bench_listen"][0]; assert c["status"] == "ok", c'

      - name: status --json and doctor --json
        run: |
          ./benchbar status --json | tee "$RUNNER_TEMP/status.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["state"] == "running" and d["web_ping_code"] == 200, d' "$RUNNER_TEMP/status.json"
          ./benchbar doctor --json >"$RUNNER_TEMP/doctor.json"
          ./benchbar repair --dry-run

      - name: benchbar down
        run: |
          ./benchbar down
          ! curl -fsS --max-time 3 "http://$SITE:8000/api/method/ping"

      - name: Logs on failure
        if: failure()
        run: |
          systemctl --user status 'benchbar-*' --no-pager || true
          journalctl --user --no-pager -n 200 || true
          ls -la ~/.local/state/benchbar/logs || true
          tail -n 200 ~/.local/state/benchbar/logs/*.log || true
          cat "$RUNNER_TEMP/doctor.json" 2>/dev/null || true

  # The Windows shim: vet, unit tests (a fake wsl.exe, so Linux is enough)
  # and both Windows builds, uploaded as one artifact. Runs when windows/shim
  # changed and on the full runs.
  shim:
    name: Windows shim (go vet, go test, amd64 and arm64 builds)
    needs: changes
    if: needs.changes.outputs.shim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: windows/shim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'next-release' || github.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: windows/shim/go.mod
          cache-dependency-path: windows/shim/go.sum

      - name: gofmt and go vet
        run: |
          go version
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          GOOS=windows go vet ./...

      - name: go test
        run: go test ./...

      - name: Build windows/amd64 and windows/arm64
        run: |
          mkdir -p "$RUNNER_TEMP/shim/amd64" "$RUNNER_TEMP/shim/arm64"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" \
              -o "$RUNNER_TEMP/shim/$arch/benchbar.exe" .
          done
          ls -l "$RUNNER_TEMP"/shim/*/benchbar.exe

      - name: Upload the exes
        uses: actions/upload-artifact@v7
        with:
          name: benchbar-shim-${{ github.sha }}
          path: ${{ runner.temp }}/shim
          if-no-files-found: error
          retention-days: 14

  # The shim against a real WSL distro on a GitHub hosted Windows runner:
  # Ubuntu 24.04 is installed with Vampire/setup-wsl and the CLI of this
  # checkout is put on the distro's PATH the way the installer does
  # (~/.local/bin/benchbar). No job depends on a personal machine, so a pull
  # request from this repo runs in the same fenced VM as any other job. Read
  # only inside the distro: status, exit codes through the hop, quoting, mcp
  # over stdio and wslconfig without --apply.
  # Not a required check, so it skips as a whole when the plan leaves the shim
  # out (windows/shim did not change on a pull request), and for Dependabot's branches, which are in this repo but not
  # written by a person.
  wsl:
    name: Windows shim against real WSL
    needs: changes
    if: >-
      needs.changes.outputs.wsl == 'true' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      BENCHBAR_TEST_DISTRO: Ubuntu-24.04
    defaults:
      run:
        shell: pwsh
        working-directory: windows/shim
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: windows/shim/go.mod
          cache-dependency-path: windows/shim/go.sum

      # v7.2.0
      - name: Install the Ubuntu 24.04 WSL distro
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4
        with:
          distribution: Ubuntu-24.04
          use-cache: 'true'

      - name: Put the CLI of this checkout in the distro
        run: |
          $src = (wsl.exe -d $env:BENCHBAR_TEST_DISTRO --exec wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          wsl.exe -d $env:BENCHBAR_TEST_DISTRO --exec /bin/sh -c 'set -eu; mkdir -p "$HOME/.local/bin"; cp -R "$0" "$HOME/benchbar-src"; ln -sf "$HOME/benchbar-src/benchbar" "$HOME/.local/bin/benchbar"' $src
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # An empty bench folder, so status --json answers state not_adopted like a
          # machine where a bench is not yet managed (the fresh distro has none).
          wsl.exe -d $env:BENCHBAR_TEST_DISTRO --exec /bin/sh -c 'mkdir -p "$HOME/frappe-bench/apps/frappe" "$HOME/frappe-bench/sites"'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Versions
        run: |
          go version
          wsl.exe --version
          wsl.exe -l -v
          wsl.exe -d $env:BENCHBAR_TEST_DISTRO --exec /bin/sh -c 'PATH="$HOME/.local/bin:$PATH"; benchbar --version'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: go vet and unit tests on Windows
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Integration tests against the real distro
        run: |
          go test -count=1 -v -tags wslintegration -run Integration ./...
          if ($LASTEXITCODE -ne 0) { exit 1 }

  app:
    name: App build, Swift tests and unsigned release bundle (macOS)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'next-release' || github.sha }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-xcodegen
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Cache DerivedData and Swift packages
        uses: actions/cache@v6
        with:
          path: macos/build/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('macos/project.yml', 'macos/BenchBar/**/*.swift', 'macos/BenchBarTests/**/*.swift') }}
          restore-keys: deriveddata-${{ runner.os }}-

      # The Release build of the app, ad hoc signed, zipped, imaged and
      # checksummed: the same script and output the separate bundle job had.
      - name: Build the unsigned release bundle (scripts/release-local.sh)
        run: scripts/release-local.sh --skip-tests

      - name: Swift tests
        run: |
          set -o pipefail
          xcodebuild -project macos/BenchBar.xcodeproj -scheme BenchBar -configuration Debug \
            -derivedDataPath macos/build/DerivedData -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= test 2>&1 | tee macos/build/test.log | \
            grep -E '^(✔|✘)|Test run with|Test Suite|error:|\*\* TEST|Executed' || true
          grep -q -E '\*\* TEST SUCCEEDED \*\*|Test run with [0-9]+ tests? passed' macos/build/test.log

      - name: Annotate compiler errors and failed tests
        if: failure()
        run: scripts/ci-annotate.sh macos/build/build.log macos/build/test.log

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: BenchBar-unsigned-${{ github.sha }}
          path: |
            dist/BenchBar-*.zip
            dist/BenchBar-*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-log
          # the build log too: xcbeautify --quiet can hide an error that has
          # no file and line (exit 65 with an empty job log)
          path: |
            macos/build/test.log
            macos/build/build.log
          if-no-files-found: ignore

  # The one required check of next-release: it needs every other job of this
  # file and fails when any of them failed or was cancelled. A skipped job (a
  # leg the plan left out) is fine. always(): it also runs, and fails, when a
  # needed job was cancelled, so a cancelled run never counts as a pass.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, cli-macos, cli-linux, cli-bash32, shellcheck, cli-linux-real, shim, wsl, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s\n' "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null; then
            echo "CI passed"
          else
            echo "::error::a job failed or was cancelled (listed above)"
            exit 1
          fi
