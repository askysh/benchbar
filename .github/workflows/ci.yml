# CI for BenchBar: the CLI tests and lint on macOS, the app build
# and Swift tests on macOS, and an unsigned release bundle you can download
# from the run to try the app without a GitHub release.
#
# The app job runs on macos-26: the project uses Xcode 26 build settings
# (default MainActor isolation, approachable concurrency) that older Xcode
# versions do not know. The CLI jobs run on macos-latest, where /bin/bash
# is the same 3.2 the CLI targets.
#
# Speed (docs/DECISIONS.md, "CI speed"): the macOS CLI tests run in three
# shards, each running its tests in parallel; shellcheck runs in shard 1
# alongside its tests; the release bundle is built in the app job from the
# same checkout and DerivedData instead of a second job.
#
# A change that touches only docs/** or site/** skips the CLI and app jobs
# (the "changes" job decides; the docs site has its own workflow, docs.yml).
# The skip happens inside the run, not with a workflow "paths-ignore": a
# skipped job counts as a pass for a required check, a workflow that never
# starts leaves it pending (docs/DECISIONS.md, "0.5.5: docs site").
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      # "code" is any file outside docs/ and site/
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!site/**'

  # The shards skip step by step, not with a job "if": a matrix job skipped
  # as a whole reports one check under its unexpanded name, so a required
  # "shard 1/3" check would wait forever. A skipped shard runs on a cheap
  # Linux runner for a few seconds and passes.
  cli-macos:
    name: CLI tests (macOS, shard ${{ matrix.shard }}/3${{ matrix.shard == 1 && ', shellcheck' || '' }})
    needs: changes
    runs-on: ${{ needs.changes.outputs.code == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - name: Skipped (only docs/ or site/ changed)
        if: env.CODE != 'true'
        run: echo "Only docs/ or site/ changed; the CLI tests do not run."

      - uses: actions/checkout@v4
        if: env.CODE == 'true'

      - name: Cache Homebrew downloads
        if: env.CODE == 'true' && matrix.shard == 1
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-shellcheck
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install shellcheck
        if: env.CODE == 'true' && matrix.shard == 1
        run: command -v shellcheck >/dev/null 2>&1 || brew install shellcheck

      - name: Versions
        if: env.CODE == 'true'
        run: |
          /bin/bash --version | head -n 1
          sysctl -n hw.ncpu
          if command -v shellcheck >/dev/null 2>&1; then shellcheck --version | sed -n 2p; fi

      # run-tests.sh runs its share of the tests PARALLEL (the CPU count) at a
      # time, and shellcheck as one more job in shard 1
      - name: CLI tests (macOS /bin/bash 3.2)
        if: env.CODE == 'true'
        env:
          SHARD: ${{ matrix.shard }}/3
        run: /bin/bash tests/run-tests.sh

  app:
    name: App build, Swift tests and unsigned release bundle (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-xcodegen
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Cache DerivedData and Swift packages
        uses: actions/cache@v4
        with:
          path: macos/build/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('macos/project.yml', 'macos/BenchBar/**/*.swift', 'macos/BenchBarTests/**/*.swift') }}
          restore-keys: deriveddata-${{ runner.os }}-

      # The Release build of the app, ad hoc signed, zipped, imaged and
      # checksummed: the same script and output the separate bundle job had.
      - name: Build the unsigned release bundle (scripts/release-local.sh)
        run: scripts/release-local.sh --skip-tests

      - name: Swift tests
        run: |
          set -o pipefail
          xcodebuild -project macos/BenchBar.xcodeproj -scheme BenchBar -configuration Debug \
            -derivedDataPath macos/build/DerivedData -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= test 2>&1 | tee macos/build/test.log | \
            grep -E '^(✔|✘)|Test run with|Test Suite|error:|\*\* TEST|Executed' || true
          grep -q -E '\*\* TEST SUCCEEDED \*\*|Test run with [0-9]+ tests? passed' macos/build/test.log

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: BenchBar-unsigned-${{ github.sha }}
          path: |
            dist/BenchBar-*.zip
            dist/BenchBar-*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: macos/build/test.log
          if-no-files-found: ignore
