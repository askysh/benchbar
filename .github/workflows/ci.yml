# CI for BenchBar: the CLI tests and lint on macOS and Linux, the app build
# and Swift tests on macOS, and an unsigned release bundle you can download
# from the run to try the app without a GitHub release.
#
# The app job runs on macos-26: the project uses Xcode 26 build settings
# (default MainActor isolation, approachable concurrency) that older Xcode
# versions do not know. The CLI jobs run on macos-latest, where /bin/bash
# is the same 3.2 the CLI targets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-macos:
    name: CLI tests and shellcheck (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-shellcheck
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install shellcheck
        run: brew install shellcheck

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x benchbar 00-mac-system-deps.sh 01-install-bench-and-site.sh 02-background-service.sh \
            lib/frappe-local/*.sh tests/*.sh tests/lib/*.sh tests/mocks/bin/* scripts/*.sh
          if [ -f install.sh ]; then shellcheck -x install.sh; fi

      - name: bash version
        run: /bin/bash --version | head -n 1

      - name: CLI tests (macOS /bin/bash 3.2)
        run: /bin/bash tests/run-tests.sh

  cli-v16:
    name: CLI tests, v16-lts profile (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: v16 profile under mocks (macOS /bin/bash 3.2)
        run: /bin/bash tests/test-profile-v16.sh

  cli-linux:
    name: CLI tests (Linux, quick signal)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and zip
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck zip unzip
      - name: CLI tests
        run: tests/run-tests.sh

  app:
    name: App build and Swift tests (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-xcodegen
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache DerivedData and Swift packages
        uses: actions/cache@v4
        with:
          path: macos/build/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('macos/project.yml', 'macos/BenchBar/**/*.swift', 'macos/BenchBarTests/**/*.swift') }}
          restore-keys: deriveddata-${{ runner.os }}-

      - name: xcodegen generate
        working-directory: macos
        run: xcodegen generate --quiet

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project macos/BenchBar.xcodeproj -scheme BenchBar -configuration Release \
            -derivedDataPath macos/build/DerivedData -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= -quiet build

      - name: Swift tests
        run: |
          set -o pipefail
          xcodebuild -project macos/BenchBar.xcodeproj -scheme BenchBar -configuration Debug \
            -derivedDataPath macos/build/DerivedData -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= test 2>&1 | tee macos/build/test.log | \
            grep -E '^(✔|✘)|Test run with|Test Suite|error:|\*\* TEST|Executed' || true
          grep -q -E '\*\* TEST SUCCEEDED \*\*|Test run with [0-9]+ tests? passed' macos/build/test.log

      - name: Upload the test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: macos/build/test.log
          if-no-files-found: ignore

  release-bundle:
    name: Unsigned release bundle (zip, dmg, SHA256SUMS)
    runs-on: macos-26
    timeout-minutes: 45
    needs: [app]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-xcodegen
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache DerivedData and Swift packages
        uses: actions/cache@v4
        with:
          path: macos/build/DerivedData
          key: deriveddata-${{ runner.os }}-${{ hashFiles('macos/project.yml', 'macos/BenchBar/**/*.swift', 'macos/BenchBarTests/**/*.swift') }}
          restore-keys: deriveddata-${{ runner.os }}-

      - name: scripts/release-local.sh
        run: scripts/release-local.sh --skip-tests

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: BenchBar-unsigned-${{ github.sha }}
          path: |
            dist/BenchBar-*.zip
            dist/BenchBar-*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
