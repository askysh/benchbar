# Builds, signs, notarizes and publishes BenchBar when a v* tag is pushed.
#
# Guarded: the "check" job looks for the signing secrets and, without
# them, the release job is skipped with a notice instead of failing. Until
# there is an Apple Developer account this workflow does nothing.
# docs/releasing.md lists every secret and how to make it.
name: macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          ED_PUBLIC: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          missing=""
          for name in CERT CERT_PASSWORD IDENTITY TEAM KEY KEY_ID ISSUER ED_KEY ED_PUBLIC; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::Signing secrets are not set (missing:${missing}). See docs/releasing.md."
          fi

  release:
    name: Build, notarize, publish
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      KEYCHAIN: ${{ runner.temp }}/release.keychain-db
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen shellcheck

      - name: CLI tests
        run: tests/run-tests.sh

      - name: Import the Developer ID certificate
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain_password="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write the notary and Sparkle keys
        env:
          KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ED_KEY" > "$RUNNER_TEMP/sparkle_ed.key"

      - name: Build, sign, notarize, package
        env:
          BENCHBAR_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          BENCHBAR_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BENCHBAR_SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_ED_KEY_PATH: ${{ runner.temp }}/sparkle_ed.key
        run: scripts/macos-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "BenchBar ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/appcast.xml dist/SHA256SUMS --clobber

      - name: Open a pull request on the Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; update askysh/homebrew-tap by hand with dist/benchbar.rb"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/askysh/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git checkout -b "benchbar-${version}"
          mkdir -p Casks
          cp "$GITHUB_WORKSPACE/dist/benchbar.rb" Casks/benchbar.rb
          git add Casks/benchbar.rb
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -m "benchbar ${version}"
          git push origin "benchbar-${version}"
          gh pr create --repo askysh/homebrew-tap --head "benchbar-${version}" --title "benchbar ${version}" \
            --body "Cask update from the BenchBar release workflow."

      - name: Remove the keychain and keys
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle_ed.key"
