# Builds BenchBar and drafts a GitHub release when a v* tag is pushed.
#
# Two paths, one workflow (docs/releasing.md):
#   Developer ID  the release: signed, notarized, stapled, with a Sparkle
#               appcast. It runs only for a v* tag, in the `release`
#               environment, which holds the signing, notarization, Sparkle
#               and tap secrets, accepts only v* tags and waits for the
#               maintainer's approval. A missing secret fails the run: a tag
#               never silently becomes an unsigned release.
#   ad hoc      only for a manual run with the `adhoc` input on: the app is ad
#               hoc signed, packaged as zip and dmg with SHA256SUMS. It reads
#               no secret and never enters the `release` environment, so a
#               test build from any branch cannot reach the keys.
#
# Both paths attach the CLI tarball the Homebrew formula installs. The tap
# is updated only after the draft is published, by homebrew-tap.yml: a
# draft's asset URLs answer 404, so a formula merged earlier would break
# brew install.
#
# The version comes from the tag (v0.3.0 -> 0.3.0) and is written into
# CFBundleShortVersionString; CFBundleVersion is the commit count.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z). Run it on the tag (--ref vX.Y.Z) for the signed release"
        required: true
      adhoc:
        description: "Build an ad hoc signed app with no secrets, for a test. Off: the run must be on a v* tag and is signed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reads no secret: it only decides the path from the ref and the input.
  check:
    name: Which path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"; else v="${REF_NAME#v}"; fi
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$v' is not a version (expected X.Y.Z)"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"
      - id: mode
        env:
          REF: ${{ github.ref }}
          ADHOC: ${{ inputs.adhoc }}
        run: |
          if [ "$ADHOC" = "true" ]; then
            case "$REF" in
              refs/tags/v*) echo "::error::The adhoc input is on, and this run is on the tag $REF. An ad hoc build never runs on a release tag: it would draft an unsigned release for it. Run it on a branch, or turn adhoc off for the signed release."; exit 1 ;;
            esac
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "::notice title=Ad hoc build::The adhoc input is on: an unsigned test build that reads no secret."
          else
            case "$REF" in
              refs/tags/v*) ;;
              *) echo "::error::A signed release builds a v* tag, and this run is on $REF. Run it on the tag (gh workflow run release.yml --ref vX.Y.Z -f version=X.Y.Z), or turn on the adhoc input for an unsigned test build."; exit 1 ;;
            esac
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "::notice title=Developer ID release::Building $REF signed, in the release environment."
          fi

  # The release. The environment makes GitHub check the ref against its
  # deployment rule (v* tags only) and wait for the reviewer before this job
  # starts, so the secrets below reach no other ref and no one unapproved.
  build-signed:
    name: Build, sign and draft the release (Developer ID)
    needs: check
    if: needs.check.outputs.mode == 'signed'
    environment: release
    runs-on: macos-26
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # The token stays out of .git/config: the tests and the build run
      # code that is not ours, and the draft step passes it to gh itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A missing secret fails the release; it never falls back to ad hoc.
      - name: Check that every signing secret is set
        env:
          S_MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          S_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          S_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          S_NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          S_NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          S_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          S_SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
        run: |
          missing=""
          for var in S_MACOS_CERTIFICATE_P12 S_MACOS_CERTIFICATE_PASSWORD S_MACOS_SIGN_IDENTITY S_APPLE_TEAM_ID \
                     S_NOTARY_API_KEY_P8 S_NOTARY_API_KEY_ID S_NOTARY_API_ISSUER_ID \
                     S_SPARKLE_ED_PRIVATE_KEY S_SPARKLE_ED_PUBLIC_KEY; do
            [ -n "${!var}" ] || missing="$missing ${var#S_}"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Not set in the release environment:${missing}. A tag build is never released unsigned. Set them (docs/releasing.md, Secrets) and re-run."
            exit 1
          fi
          echo "All nine signing secrets are set."

      - uses: ./.github/actions/release-prepare
        with:
          version: ${{ env.VERSION }}

      # The certificate, the notary key and the Sparkle key exist only from
      # here to the cleanup step below. The certificate is imported in this
      # step and its file deleted at once; the script writes the notary and
      # Sparkle keys to a temporary file for the one command that needs each
      # and removes it again. The keychain is not given to every program (no
      # -A): codesign only.
      - name: Build, sign, notarize, package
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          BENCHBAR_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          BENCHBAR_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BENCHBAR_SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          # the one folder the script writes the notary and Sparkle key files
          # into; the cleanup step removes it
          mkdir -p "$RUNNER_TEMP/release-keys"
          echo "BENCHBAR_KEY_DIR=$RUNNER_TEMP/release-keys" >> "$GITHUB_ENV"
          export BENCHBAR_KEY_DIR="$RUNNER_TEMP/release-keys"
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          # Locks after an hour without use. Not shorter: the build signs, waits
          # for notarization (up to NOTARY_TIMEOUT, 50 minutes) and signs again.
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # what the build and its tests do not need stays out of their environment
          unset CERT CERT_PASSWORD keychain_password
          scripts/macos-release.sh "$VERSION"

      # Right after the build, pass or fail, and before anything else runs.
      - name: Remove the keychain and keys
        if: always()
        run: |
          [ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"
          [ -z "${BENCHBAR_KEY_DIR:-}" ] || rm -rf "$BENCHBAR_KEY_DIR"

      - uses: ./.github/actions/release-draft
        with:
          version: ${{ env.VERSION }}
          signed: "true"

  # A test build for a manual run with the adhoc input. No environment, no
  # secret: nothing here can reach the release keys.
  build-adhoc:
    name: Build and draft the release (ad hoc)
    needs: check
    if: needs.check.outputs.mode == 'adhoc'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/release-prepare
        with:
          version: ${{ env.VERSION }}

      - name: Build, ad hoc sign, package
        run: scripts/release-local.sh "$VERSION"

      - uses: ./.github/actions/release-draft
        with:
          version: ${{ env.VERSION }}
          signed: "false"
