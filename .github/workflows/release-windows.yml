# Builds the Windows download of BenchBar (benchbar.exe and the tray app) and
# attaches it to the same draft GitHub release the Mac workflow (release.yml)
# creates.
#
# Triggers:
#   tag v*             build the tag, package, attach to the draft release
#   workflow_dispatch  same, for a version you type, but only when
#                      "draft_release" is on (off by default). That run builds
#                      refs/tags/vX.Y.Z, never the commit you dispatched from,
#                      and fails when the tag does not exist. With it off the
#                      run builds the dispatched ref and only uploads a
#                      workflow artifact, unsigned. (Dispatch works only once
#                      this file is on main, so the pull request path exists.)
#                      Its benchbar.exe gets a dev version (0.0.0-dev-SHA), not
#                      the typed one, so the shim never pins its CLI install
#                      to a tag that does not exist. The zip name keeps the
#                      typed version.
#   pull_request       when this file or install.ps1 changes: build, package
#                      and run the installer against the zip. Never touches a
#                      release. A tag push runs the installer test too, before
#                      the release job.
#
# What it ships, per architecture (amd64 and arm64):
#   benchbar-windows-<version>-<arch>.zip   benchbar.exe, the tray app (when
#                      windows/tray is on the ref), README.txt, SHA256SUMS
#   benchbar-windows-<version>-SHA256SUMS.txt   one file for both zips. The
#                      name must not end in SHA256SUMS: the Mac release has an
#                      asset named exactly that and install.sh takes the first
#                      asset whose name ends in it.
#
# Nothing is code signed. SignPath Foundation declined the project on
# 2026-11-13 and the Store route is not part of 0.9.0, so every .exe and .dll
# ships as built. README.txt and the release notes still list what
# Get-AuthenticodeSignature says about every .exe and .dll in the zip, so a
# download says plainly what is signed (today: only third party libraries).
#
# Build provenance: the release job attests both zips (actions/attest-build-
# provenance), so `gh attestation verify FILE.zip -R askysh/benchbar` works.
# The checksums file is attested too, and lists install.ps1 of the tag.
#
# benchbar.exe carries a version resource (company, product, description,
# version, asInvoker manifest), generated before go build from
# windows/shim/versioninfo.json. A plain `go build` works without it.
#
# The release job only ever creates or edits a DRAFT. A published release gets
# its assets but its notes are left alone. Publishing is a human step.
name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z or X.Y.Z-rc.N); with a release, the tag vX.Y.Z must exist"
        required: true
        type: string
      draft_release:
        description: "Build the tag and attach to its existing draft release (off: build this ref, upload a workflow artifact only)"
        required: false
        default: false
        type: boolean
      wait_for_draft:
        description: "Wait for release.yml's draft as a tag push does (auto-tag.yml starts both at once)"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/release-windows.yml"
      - "windows/tray/scripts/**"
      - "install.ps1"
      - "windows/shim/versioninfo.json"
      - "windows/shim/benchbar.manifest"

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      shim_version: ${{ steps.v.outputs.shim_version }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRAFT: ${{ inputs.draft_release }}
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release=false
          case "$EVENT" in
            push) v="${REF_NAME#v}"; release=true ;;
            workflow_dispatch)
              v="${INPUT_VERSION#v}"
              [ "$INPUT_DRAFT" = "true" ] && release=true
              ;;
            *) v="0.0.0-pr${PR_NUMBER}" ;;
          esac
          # the same pattern as scripts/check-version.sh; test-version-sources keeps them equal
          if [ "$EVENT" != "pull_request" ] && ! [[ "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::'$v' is not a version (expected X.Y.Z or X.Y.Z-rc.N)"; exit 1
          fi
          if [ "$release" = "true" ] && ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${v}" >/dev/null 2>&1; then
            echo "::error::The tag v${v} does not exist. A run that attaches to a release builds that tag, so push it first (release.yml builds the Mac side from the same tag)."
            exit 1
          fi
          # Only a build of a release tag says it is that release. The shim
          # pins the CLI install inside the distro to its own version when it
          # looks like X.Y.Z, so any other build gets a dev version.
          shim="$v"
          if [ "$release" != "true" ]; then shim="0.0.0-dev-${GITHUB_SHA::7}"; fi
          {
            echo "version=$v"
            echo "release=$release"
            echo "shim_version=$shim"
          } >> "$GITHUB_OUTPUT"
          echo "Windows build of version $v (attach to a release: $release; benchbar.exe says $shim)"

  package:
    name: Package (${{ matrix.arch }})
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: win-x64
            machine: "0x8664"
          - arch: arm64
            rid: win-arm64
            machine: "0xAA64"
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHIM_VERSION: ${{ needs.version.outputs.shim_version }}
      ARCH: ${{ matrix.arch }}
      RID: ${{ matrix.rid }}
      MACHINE: ${{ matrix.machine }}
    steps:
      # a run that attaches to a release builds the tag, not the dispatched commit
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release == 'true' && format('refs/tags/v{0}', needs.version.outputs.version) || '' }}

      - name: Say which commit this builds
        run: |
          Write-Host "Building $(git rev-parse HEAD) for version $env:VERSION"

      - name: Helper to read a binary's CPU type
        run: |
          # dot sourced by later steps: Get-PeMachine FILE -> 0x8664 (amd64) or 0xAA64 (arm64)
          @'
          function Get-PeMachine([string]$Path) {
            $b = [IO.File]::ReadAllBytes($Path)
            if ($b.Length -lt 0x40 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "$Path is not a Windows executable" }
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            if ($b[$pe] -ne 0x50 -or $b[$pe + 1] -ne 0x45) { throw "$Path has no PE header" }
            return ('0x{0:X4}' -f [BitConverter]::ToUInt16($b, $pe + 4))
          }
          function Assert-PeMachine([string]$Path, [string]$Expected) {
            $got = Get-PeMachine $Path
            if ($got -ne $Expected) { throw "$Path is built for CPU type $got, expected $Expected ($env:ARCH)" }
            Write-Host "$Path is $env:ARCH ($got)"
          }
          '@ | Set-Content -Path "$env:RUNNER_TEMP/pe.ps1" -Encoding utf8

      # ------------------------------------------------------------- shim
      - uses: actions/setup-go@v7
        with:
          go-version-file: windows/shim/go.mod
          cache-dependency-path: windows/shim/go.sum

      - name: Test the shim
        if: matrix.arch == 'amd64'
        working-directory: windows/shim
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go vet ./...
          go test ./...

      # The version resource (what Explorer shows under Properties, Details):
      # company, product, description, version and an asInvoker manifest. It is
      # a .syso file next to the Go code, never committed (.gitignore). The tool
      # runs on the build machine, so this step sets no GOOS or GOARCH.
      - name: Make the version resource for benchbar.exe
        working-directory: windows/shim
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0
          $tool = Join-Path (go env GOPATH) 'bin/goversioninfo.exe'
          if ($env:VERSION -notmatch '^(\d+)\.(\d+)\.(\d+)') { throw "cannot read a version from '$env:VERSION'" }
          $major, $minor, $patch = [int]$Matches[1], [int]$Matches[2], [int]$Matches[3]
          # -64 alone is amd64, -arm -64 is arm64
          $archFlags = @('-64')
          if ($env:ARCH -eq 'arm64') { $archFlags = @('-arm', '-64') }
          & $tool @archFlags `
            "-ver-major=$major" "-ver-minor=$minor" "-ver-patch=$patch" '-ver-build=0' `
            "-product-ver-major=$major" "-product-ver-minor=$minor" "-product-ver-patch=$patch" '-product-ver-build=0' `
            "-file-version=$major.$minor.$patch.0" "-product-version=$env:VERSION" `
            "-o=resource_windows_$env:ARCH.syso" versioninfo.json
          if (-not (Test-Path "resource_windows_$env:ARCH.syso")) { throw 'goversioninfo wrote no .syso file' }
          Get-ChildItem *.syso | Format-Table Name, Length

      - name: Build benchbar.exe
        working-directory: windows/shim
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . "$env:RUNNER_TEMP/pe.ps1"
          $out = Join-Path $env:GITHUB_WORKSPACE 'out/benchbar.exe'
          # SHIM_VERSION is the release version for a release build and a dev
          # version (0.0.0-dev-SHA) for any other build
          $ldflags = "-s -w -X main.version=$env:SHIM_VERSION"
          go build -trimpath -ldflags $ldflags -o $out .
          Assert-PeMachine $out $env:MACHINE

      # ------------------------------------------------------------- tray
      # An older tag may predate the tray app: then the zip is shim only.
      - name: Is the tray app on this ref
        id: tray
        run: |
          if (Test-Path 'windows/tray/BenchBarTray/BenchBarTray.csproj') {
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning title=No tray app::windows/tray/BenchBarTray is not on this ref. Shipping a shim only zip."
          }

      - uses: actions/setup-dotnet@v6
        if: steps.tray.outputs.present == 'true'
        with:
          global-json-file: windows/tray/global.json

      - name: Publish the tray app
        if: steps.tray.outputs.present == 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . "$env:RUNNER_TEMP/pe.ps1"
          # Directory.Build.props pins win-x64 and Platform x64; arm64 overrides all three
          $extra = @()
          if ($env:ARCH -eq 'arm64') { $extra = @('-p:Platform=arm64', '-p:PlatformTarget=arm64') }
          # Company, Product and FileDescription are what Explorer and the
          # security dialogs show for BenchBarTray.exe
          $meta = @('-p:Company=Akash Mishra', '-p:Product=BenchBar', '-p:AssemblyTitle=BenchBar tray app', '-p:Description=BenchBar tray app for Windows', '-p:Copyright=Copyright (c) 2026 Akash Mishra. MIT License.')
          dotnet publish windows/tray/BenchBarTray/BenchBarTray.csproj -c Release -r $env:RID --self-contained false "-p:Version=$env:VERSION" @meta @extra -o out/tray
          $exe = 'out/tray/BenchBarTray.exe'
          if (-not (Test-Path $exe)) { throw "dotnet publish did not produce $exe" }
          # fail loudly rather than ship amd64 bits in the arm64 zip
          Assert-PeMachine $exe $env:MACHINE

      # The tray's own tests (the test projects are x64; the arm64 leg is started by
      # the tray-arm64 job below, on an arm64 runner).
      - name: Test the tray app
        if: steps.tray.outputs.present == 'true' && matrix.arch == 'amd64'
        # from windows/tray: the SDK reads that folder's global.json (the
        # Microsoft.Testing.Platform runner) only from the working folder upward
        working-directory: windows/tray
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet test BenchBarTray.sln -c Release

      # What ships, started once on recorded data: it must stay up and quit cleanly
      # (windows/tray/scripts/smoke.ps1). A publish that lacks a file or a manifest
      # that does not load passes every other check and fails here.
      - name: Start the tray app once
        if: steps.tray.outputs.present == 'true' && matrix.arch == 'amd64' && hashFiles('windows/tray/scripts/smoke.ps1') != ''
        run: ./windows/tray/scripts/smoke.ps1 -Dir out/tray -Fixtures windows/tray/fixtures/rest -Version $env:VERSION

      # ------------------------------------------------------------- package
      - name: Write README.txt and SHA256SUMS, build the zip
        env:
          HAS_TRAY: ${{ steps.tray.outputs.present }}
          RELEASE_BUILD: ${{ needs.version.outputs.release }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pkg = 'pkg'
          New-Item -ItemType Directory -Force $pkg, dist | Out-Null
          Copy-Item out/benchbar.exe $pkg/
          # the installer rides along, so a build sent by hand installs from its unpacked folder
          Copy-Item install.ps1 $pkg/
          $hasTray =($env:HAS_TRAY -eq 'true') -and (Test-Path out/tray/BenchBarTray.exe)
          if ($hasTray) { Copy-Item out/tray/* $pkg/ -Recurse -Force }
          $root = (Resolve-Path $pkg).Path

          # what Get-AuthenticodeSignature says about every .exe and .dll that ships
          $firstParty = @('benchbar.exe', 'BenchBarTray.exe', 'BenchBarTray.dll', 'BenchBar.Tray.Core.dll')
          $files = @(Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' } | Sort-Object FullName | ForEach-Object {
              $rel = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
              $sig = Get-AuthenticodeSignature -FilePath $_.FullName
              $signer = ''
              if ($sig.Status -eq 'Valid') {
                $signer = $sig.SignerCertificate.Subject
                if ($signer -match 'CN=([^,]+)') { $signer = $Matches[1].Trim('"') }
              }
              [ordered]@{ name = $rel; signed = ($sig.Status -eq 'Valid'); status = [string]$sig.Status; signer = $signer; firstParty = ($firstParty -contains $rel) }
            })
          [ordered]@{ arch = $env:ARCH; version = $env:VERSION; tray = $hasTray; files = $files } |
            ConvertTo-Json -Depth 5 | Set-Content -Path "dist/signing-$env:ARCH.json" -Encoding utf8
          Get-Content "dist/signing-$env:ARCH.json" | Select-Object -First 60

          $signedList = @($files | Where-Object { $_.signed } | ForEach-Object { if ($_.signer) { "$($_.name) ($($_.signer))" } else { $_.name } })
          $unsignedList = @($files | Where-Object { -not $_.signed } | ForEach-Object { $_.name })
          $ownUnsigned = @($files | Where-Object { $_.firstParty -and -not $_.signed } | ForEach-Object { $_.name })
          $signedText = 'none'
          if ($signedList.Count -gt 0) { $signedText = $signedList -join ', ' }
          if ($unsignedList.Count -eq 0) {
            $signing = 'Every .exe and .dll in this download carries a valid signature.'
          } else {
            $signing = "Signed:     $signedText`nNot signed: $($unsignedList -join ', ')`n(Third party libraries are signed by their authors or not at all; this`nproject signs only its own programs.)"
            if ($ownUnsigned.Count -gt 0) {
              $signing += "`nThis project's own programs not signed yet: $($ownUnsigned -join ', '). With Smart App Control on, Windows blocks unsigned programs (the installer says so before it writes anything). Otherwise Windows may show 'Open File - Security Warning: The publisher could not be verified' the first time you start one: choose Run."
            }
          }

          if ($hasTray) {
            $programs = @"
          benchbar.exe      The command line. Runs the BenchBar CLI inside your WSL 2
                            distro, so "benchbar status" works from PowerShell and cmd.
          BenchBarTray.exe  The tray app: shows your benches and starts and stops them.
                            It needs the .NET 10 Desktop Runtime:
                              winget install Microsoft.DotNet.DesktopRuntime.10
          "@
          } else {
            $programs = @"
          benchbar.exe      The command line. Runs the BenchBar CLI inside your WSL 2
                            distro, so "benchbar status" works from PowerShell and cmd.
          This download has no tray app.
          "@
          }
          # the one liner of a release pins the installer and the version and
          # leaves nothing set in the user's session; a build that is not a
          # release has no tag to point at, so it points at main
          $rawUrl = 'https://raw.githubusercontent.com/askysh/benchbar'
          if ($env:RELEASE_BUILD -eq 'true') {
            $oneLead = 'From a published release, the one liner does the same (this line pins the installer and the version of this release and sets nothing in your session):'
            $oneLine = "& ([scriptblock]::Create((irm $rawUrl/v$env:VERSION/install.ps1))) -Version $env:VERSION"
          } else {
            $oneLead = 'This is a test build, not a published release. The one liner installs the newest published release, not this build:'
            $oneLine = "irm $rawUrl/main/install.ps1 | iex"
          }
          $readme = @"
          BenchBar for Windows $env:VERSION ($env:ARCH)

          $programs

          Install from this folder (per user, no administrator rights): unpack
          the whole zip, open PowerShell in the unpacked folder and run
            powershell -ExecutionPolicy Bypass -File .\install.ps1
          It checks every file against SHA256SUMS, installs to
          %LOCALAPPDATA%\Programs\BenchBar, removes the "downloaded from the
          internet" mark from the installed files, puts benchbar.exe on your
          PATH and ends with benchbar.exe doctor. Running it again updates in
          place. To remove BenchBar again, run the same command with -Uninstall.

          $oneLead
            $oneLine

          Code signing, as checked with Get-AuthenticodeSignature when this zip was built:
          $signing

          Your benches, sites and databases stay inside the WSL distro. Nothing
          here writes inside a distro.

          Documentation: https://benchbar.akashmishra.com/windows/
          "@
          $readme = $readme -replace "`r?`n", "`r`n"
          [IO.File]::WriteAllText((Join-Path $root 'README.txt'), $readme + "`r`n", (New-Object Text.UTF8Encoding $false))

          # hashes of every file in the zip (except the list itself), LF endings
          $lines = Get-ChildItem $root -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object FullName | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $rel
          }
          [IO.File]::WriteAllText((Join-Path $root 'SHA256SUMS'), (($lines -join "`n") + "`n"), (New-Object Text.UTF8Encoding $false))

          $zip = Join-Path (Resolve-Path dist).Path "benchbar-windows-$env:VERSION-$env:ARCH.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($root, $zip, [IO.Compression.CompressionLevel]::Optimal, $false)

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist).Path "sums-$env:ARCH.txt"), ("{0}  {1}`n" -f $hash, (Split-Path $zip -Leaf)), (New-Object Text.UTF8Encoding $false))
          Get-ChildItem dist | Format-Table Name, Length
          Get-Content "dist/sums-$env:ARCH.txt"
          Get-Content (Join-Path $root 'README.txt')

      - name: Upload the zip, its sums line and the signing record
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # The arm64 zip is built on an x64 runner, which cannot run it. Start its tray
  # app here, on a hosted Windows on Arm runner, the way the amd64 leg does.
  tray-arm64:
    name: Tray app starts (arm64)
    needs: [version, package]
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release == 'true' && format('refs/tags/v{0}', needs.version.outputs.version) || '' }}
      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64
          path: source
      - name: Unpack the zip
        id: unpack
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'arm64'
          Expand-Archive (Get-ChildItem source -Filter *.zip).FullName -DestinationPath $unpacked -Force
          $has = Test-Path (Join-Path $unpacked 'BenchBarTray.exe')
          if (-not $has) { Write-Host '::warning title=No tray app::the arm64 zip has no BenchBarTray.exe (an older tag): nothing to start.' }
          "dir=$unpacked" >> $env:GITHUB_OUTPUT
          "present=$($has.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v6
        if: steps.unpack.outputs.present == 'true'
        with:
          global-json-file: windows/tray/global.json
      - name: Start the tray app once
        if: steps.unpack.outputs.present == 'true' && hashFiles('windows/tray/scripts/smoke.ps1') != ''
        run: ./windows/tray/scripts/smoke.ps1 -Dir '${{ steps.unpack.outputs.dir }}' -Fixtures windows/tray/fixtures/rest -Version $env:VERSION

  # Runs on every trigger, a tag push included: the release job waits for it,
  # so a zip the installer cannot install is never attached to a release.
  installer-test:
    name: Installer test
    needs: [version, package]
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHIM_VERSION: ${{ needs.version.outputs.shim_version }}
      # The installer keeps the internet mark unless the build provenance verified, and
      # starting a marked program makes Windows ask "Open File - Security Warning" and wait
      # for a click that nobody gives on the runner. This variable skips that question for
      # the programs these steps start; the marks themselves are still checked by the steps.
      SEE_MASK_NOZONECHECKS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-amd64
          path: source

      - name: Make the sums file the release job would write
        run: |
          Copy-Item source/sums-amd64.txt "source/benchbar-windows-$env:VERSION-SHA256SUMS.txt"
          Get-ChildItem source | Format-Table Name, Length

      - name: Install into a fresh LOCALAPPDATA (PowerShell 7)
        run: |
          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-pwsh'
          New-Item -ItemType Directory -Force $fresh | Out-Null
          $env:LOCALAPPDATA = $fresh
          pwsh -NoProfile -File install.ps1 -Source (Resolve-Path source).Path -NoTray -Yes
          # doctor finds no WSL on this runner; the install itself must still succeed
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          $exe = Join-Path $fresh 'Programs/BenchBar/benchbar.exe'
          if (-not (Test-Path $exe)) { throw "$exe is missing" }
          $said = (& $exe --shim-version) -join "`n"
          Write-Host $said
          if ($said -notmatch [regex]::Escape($env:SHIM_VERSION)) { throw "--shim-version did not print $env:SHIM_VERSION" }

      - name: Install again with Windows PowerShell 5.1 (an update in place)
        shell: powershell
        run: |
          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-pwsh'
          $env:LOCALAPPDATA = $fresh
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Source (Resolve-Path source).Path -NoTray -Yes
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          $exe = Join-Path $fresh 'Programs\BenchBar\benchbar.exe'
          $said = (& $exe --shim-version) -join "`n"
          Write-Host $said
          if ($said -notmatch [regex]::Escape($env:SHIM_VERSION)) { throw "--shim-version did not print $env:SHIM_VERSION" }

      - name: Piped into iex leaves the session alone
        run: |
          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-iex'
          New-Item -ItemType Directory -Force $fresh | Out-Null
          $env:LOCALAPPDATA = $fresh
          $env:BENCHBAR_NO_TRAY = '1'; $env:BENCHBAR_YES = '1'
          $env:BENCHBAR_SOURCE = (Resolve-Path source).Path
          $Version = 'mine'; $Source = 'mine'
          Get-Content install.ps1 -Raw | Invoke-Expression
          if ($Version -ne 'mine' -or $Source -ne 'mine') { throw 'the installer overwrote variables of the calling session' }
          if (-not (Test-Path (Join-Path $fresh 'Programs/BenchBar/benchbar.exe'))) { throw 'the iex install did not install' }

      - name: A wrong checksum must be refused
        run: |
          $bad = Join-Path $env:RUNNER_TEMP 'bad-source'
          New-Item -ItemType Directory -Force $bad | Out-Null
          Copy-Item source/*.zip $bad
          $zip = (Get-ChildItem $bad -Filter *.zip).Name
          Set-Content "$bad/benchbar-windows-$env:VERSION-SHA256SUMS.txt" ("{0}  {1}" -f ('0' * 64), $zip)
          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-bad'
          New-Item -ItemType Directory -Force $fresh | Out-Null
          $env:LOCALAPPDATA = $fresh
          pwsh -NoProfile -File install.ps1 -Source $bad -NoTray -Yes
          if ($LASTEXITCODE -eq 0) { throw 'install.ps1 accepted a wrong checksum' }
          if (Test-Path (Join-Path $fresh 'Programs/BenchBar/benchbar.exe')) { throw 'a refused install left files behind' }
          $global:LASTEXITCODE = 0

      - name: By hand, from the unpacked zip with its own install.ps1
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'unpacked'
          Expand-Archive (Get-ChildItem source -Filter *.zip).FullName -DestinationPath $unpacked -Force
          if (-not (Test-Path (Join-Path $unpacked 'install.ps1'))) { throw 'the zip carries no install.ps1' }
          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-folder'
          New-Item -ItemType Directory -Force $fresh | Out-Null
          $env:LOCALAPPDATA = $fresh
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $unpacked 'install.ps1') -NoTray -Yes
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 from the unpacked folder exited with $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $fresh 'Programs/BenchBar/benchbar.exe'))) { throw 'the folder install did not install' }

      - name: By hand, -Zip without a checksums file
        run: |
          $alone = Join-Path $env:RUNNER_TEMP 'zip-alone'
          New-Item -ItemType Directory -Force $alone | Out-Null
          Copy-Item source/*.zip $alone
          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-zip'
          New-Item -ItemType Directory -Force $fresh | Out-Null
          $env:LOCALAPPDATA = $fresh
          pwsh -NoProfile -File install.ps1 -Zip (Get-ChildItem $alone -Filter *.zip).FullName -NoTray -Yes
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Zip exited with $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $fresh 'Programs/BenchBar/benchbar.exe'))) { throw 'the -Zip install did not install' }

      # gh.cmd on PATH stands in for the GitHub CLI: `auth status` succeeds,
      # `attestation verify` exits with the code of the case. The mark itself is
      # tested above; here the installer's decision is: say it verified and
      # remove the mark, or keep the mark and say so.
      - name: By hand, -Zip, the internet mark goes only with a verified attestation
        run: |
          $stub = Join-Path $env:RUNNER_TEMP 'gh-stub'
          New-Item -ItemType Directory -Force $stub | Out-Null
          $zip = (Get-ChildItem source -Filter benchbar-windows-*.zip).FullName
          $oldPath = $env:PATH
          foreach ($case in @(@{ Name = 'verified'; Exit = 0 }, @{ Name = 'refused'; Exit = 1 })) {
            Set-Content -LiteralPath (Join-Path $stub 'gh.cmd') -Encoding ASCII -Value "@echo off`r`nif `"%1`"==`"auth`" exit /b 0`r`nexit /b $($case.Exit)"
            $env:PATH = "$stub;$oldPath"
            $fresh = Join-Path $env:RUNNER_TEMP "localappdata-attest-$($case.Name)"
            New-Item -ItemType Directory -Force $fresh | Out-Null
            $env:LOCALAPPDATA = $fresh
            $said = (pwsh -NoProfile -File install.ps1 -Zip $zip -NoTray -Yes 2>&1 | Out-String)
            Write-Host $said
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Zip exited with $LASTEXITCODE ($($case.Name))" }
            if ($case.Exit -eq 0) {
              if ($said -notmatch 'Build provenance verified') { throw 'a verified attestation was not reported' }
              if ($said -notmatch 'removed the "downloaded from the internet" mark') { throw 'the mark was not removed after a verified attestation' }
            } else {
              if ($said -notmatch 'did not accept') { throw 'a refused attestation was not reported' }
              if ($said -notmatch 'kept the "downloaded from the internet" mark') { throw 'the mark was not kept after a refused attestation' }
            }
          }
          $env:PATH = $oldPath
          # no gh at all: the same decision, with the way to check by hand
          $env:PATH = (($env:PATH -split ';') | Where-Object { -not (Test-Path (Join-Path $_ 'gh.exe')) -and -not (Test-Path (Join-Path $_ 'gh.cmd')) }) -join ';'
          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-attest-nogh'
          New-Item -ItemType Directory -Force $fresh | Out-Null
          $env:LOCALAPPDATA = $fresh
          $said = (pwsh -NoProfile -File install.ps1 -Zip $zip -NoTray -Yes 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Zip exited with $LASTEXITCODE (no gh)" }
          if ($said -notmatch 'gh attestation verify') { throw 'without gh, the way to check by hand is missing' }
          if ($said -notmatch 'kept the "downloaded from the internet" mark') { throw 'the mark was not kept without gh' }
          $env:PATH = $oldPath

      # The release list comes from a file (BENCHBAR_TEST_RELEASES), its
      # downloads from a closed port: the run stops at the download, after it
      # has said which newer release it passed over.
      - name: A newer release without Windows files is named, not skipped silently
        run: |
          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-skipped'
          New-Item -ItemType Directory -Force $fresh | Out-Null
          $env:LOCALAPPDATA = $fresh
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'amd64' }
          $list = @(
            @{ tag_name = 'v9.9.1'; draft = $false; prerelease = $false; published_at = '2030-01-02T00:00:00Z'; assets = @() },
            @{ tag_name = 'v9.9.0'; draft = $false; prerelease = $false; published_at = '2030-01-01T00:00:00Z'; assets = @(
                @{ name = "benchbar-windows-9.9.0-$arch.zip"; browser_download_url = "http://127.0.0.1:9/benchbar-windows-9.9.0-$arch.zip" },
                @{ name = 'benchbar-windows-9.9.0-SHA256SUMS.txt'; browser_download_url = 'http://127.0.0.1:9/sums.txt' }) }
          )
          $file = Join-Path $env:RUNNER_TEMP 'releases.json'
          ConvertTo-Json -InputObject $list -Depth 6 | Set-Content -LiteralPath $file -Encoding UTF8
          $env:BENCHBAR_TEST_RELEASES = $file
          $said = (pwsh -NoProfile -File install.ps1 -NoTray -Yes 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Remove-Item Env:BENCHBAR_TEST_RELEASES
          Write-Host $said
          if ($code -eq 0) { throw 'the install went on to a closed port' }
          if ($said -notmatch 'Skipped the newer release v9\.9\.1: it has no') { throw 'the skipped newer release was not named' }
          if ($said -notmatch 'Installing v9\.9\.0 instead') { throw 'the release it falls back to was not named' }
          if (Test-Path (Join-Path $fresh 'Programs')) { throw 'a stopped install wrote files' }
          $global:LASTEXITCODE = 0

      - name: By hand, a changed file in the unpacked folder must be refused
        run: |
          $changed = Join-Path $env:RUNNER_TEMP 'changed'
          Expand-Archive (Get-ChildItem source -Filter *.zip).FullName -DestinationPath $changed -Force
          Add-Content (Join-Path $changed 'README.txt') 'changed'
          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-changed'
          New-Item -ItemType Directory -Force $fresh | Out-Null
          $env:LOCALAPPDATA = $fresh
          pwsh -NoProfile -File (Join-Path $changed 'install.ps1') -NoTray -Yes
          if ($LASTEXITCODE -eq 0) { throw 'install.ps1 installed a folder whose files do not match SHA256SUMS' }
          if (Test-Path (Join-Path $fresh 'Programs/BenchBar/benchbar.exe')) { throw 'a refused folder install left files behind' }
          $global:LASTEXITCODE = 0

      - name: Smart App Control on (faked) stops before anything is written
        run: |
          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-sac'
          New-Item -ItemType Directory -Force $fresh | Out-Null
          $env:LOCALAPPDATA = $fresh
          # BENCHBAR_TEST_SAC_STATE stands in for the registry value, for this test only
          $env:BENCHBAR_TEST_SAC_STATE = '1'
          $said = (pwsh -NoProfile -File install.ps1 -Source (Resolve-Path source).Path -NoTray -Yes 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $said
          if ($code -eq 0) { throw 'install.ps1 went on with Smart App Control on' }
          if ($said -notmatch 'Smart App Control is on') { throw 'the message about Smart App Control is missing' }
          if ($said -notmatch 'windows/#smart-app-control') { throw 'the link to the docs is missing' }
          if (Test-Path (Join-Path $fresh 'Programs')) { throw 'a stopped install wrote files' }
          # evaluation mode warns and goes on
          $env:BENCHBAR_TEST_SAC_STATE = '2'
          $said = (pwsh -NoProfile -File install.ps1 -Source (Resolve-Path source).Path -NoTray -Yes 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE in evaluation mode" }
          if ($said -notmatch 'evaluation mode') { throw 'no warning for evaluation mode' }
          if (-not (Test-Path (Join-Path $fresh 'Programs/BenchBar/benchbar.exe'))) { throw 'the evaluation mode install did not install' }
          Remove-Item Env:BENCHBAR_TEST_SAC_STATE
          $global:LASTEXITCODE = 0

      # A stub tray app (a copy of benchbar.exe, which exits at once) stands in
      # for BenchBarTray.exe, so no WPF window opens on the runner. The folder
      # is marked as downloaded from the internet, like an unpacked browser zip.
      - name: Fresh install with the tray from a marked folder (Windows PowerShell 5.1), then uninstall
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem source -Filter *.zip).FullName
          $unpacked = Join-Path $env:RUNNER_TEMP 'marked'
          Expand-Archive $zip -DestinationPath $unpacked -Force
          Copy-Item (Join-Path $unpacked 'benchbar.exe') (Join-Path $unpacked 'BenchBarTray.exe') -Force
          $stubHash = (Get-FileHash (Join-Path $unpacked 'BenchBarTray.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumsFile = Join-Path $unpacked 'SHA256SUMS'
          $lines = @(Get-Content $sumsFile | Where-Object { $_ -notmatch '\s\*?BenchBarTray\.exe\s*$' })
          $lines += "$stubHash  BenchBarTray.exe"
          [IO.File]::WriteAllText($sumsFile, (($lines -join "`n") + "`n"), (New-Object Text.UTF8Encoding $false))
          foreach ($f in Get-ChildItem $unpacked -Recurse -File) {
            Set-Content -LiteralPath $f.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $marked = @(Get-ChildItem $unpacked -Recurse -File | Where-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue })
          if ($marked.Count -eq 0) { throw 'the test could not mark the files' }

          $fresh = Join-Path $env:RUNNER_TEMP 'localappdata-tray'
          New-Item -ItemType Directory -Force $fresh | Out-Null
          $env:LOCALAPPDATA = $fresh
          $env:BENCHBAR_TEST_DOTNET_DESKTOP = '1'   # this test has no .NET 10 Desktop Runtime to look for
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $unpacked 'install.ps1') -Yes
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }

          $installDir = Join-Path $fresh 'Programs\BenchBar'
          if (-not (Test-Path (Join-Path $installDir 'BenchBarTray.exe'))) { throw 'the tray app was not installed' }
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'BenchBar.lnk'
          $startup = Join-Path ([Environment]::GetFolderPath('Startup')) 'BenchBar Tray.lnk'
          if (-not (Test-Path $menu)) { throw "no Start menu shortcut at $menu" }
          if (-not (Test-Path $startup)) { throw "no Startup shortcut at $startup" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($menu).TargetPath
          if ($target -ine (Join-Path $installDir 'BenchBarTray.exe')) { throw "the Start menu shortcut points to $target" }
          $still = @(Get-ChildItem $installDir -Recurse -File | Where-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue })
          # run from an unpacked folder there is no zip to verify: the mark stays
          if ($still.Count -eq 0) { throw 'the internet mark was removed with no verified build provenance' }

          # uninstall: the files, the shortcuts, the PATH entry and the folder go
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $unpacked 'install.ps1') -Uninstall -Yes
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Uninstall exited with $LASTEXITCODE" }
          if (Test-Path $menu) { throw 'the Start menu shortcut is still there' }
          if (Test-Path $startup) { throw 'the Startup shortcut is still there' }
          if (Test-Path $installDir) { throw 'the install folder is still there' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -and (($userPath -split ';') | Where-Object { $_.TrimEnd('\') -ieq $installDir })) { throw 'the install folder is still on the user PATH' }
          Remove-Item Env:BENCHBAR_TEST_DOTNET_DESKTOP

      # Version A is the zip with a stub tray (as above); version B is A with
      # every file changed by an appended line break, under another version number.
      # One installed file held open without delete sharing must make the
      # update to B fail and leave every file of A as it was. Each host runs
      # the installer once: Windows PowerShell 5.1, then PowerShell 7.
      - name: A held file rolls the whole update back (both PowerShell hosts)
        run: |
          $zip = (Get-ChildItem source -Filter *.zip).FullName
          $folderA = Join-Path $env:RUNNER_TEMP 'held-a'
          Expand-Archive $zip -DestinationPath $folderA -Force
          Copy-Item (Join-Path $folderA 'benchbar.exe') (Join-Path $folderA 'BenchBarTray.exe') -Force
          function Write-Sums([string]$Folder) {
            $root = (Resolve-Path $Folder).Path
            $lines = Get-ChildItem $root -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object FullName | ForEach-Object {
              '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.FullName.Substring($root.Length + 1).Replace('\', '/')
            }
            [IO.File]::WriteAllText((Join-Path $root 'SHA256SUMS'), (($lines -join "`n") + "`n"), (New-Object Text.UTF8Encoding $false))
          }
          Write-Sums $folderA
          $folderB = Join-Path $env:RUNNER_TEMP 'held-b'
          Copy-Item $folderA $folderB -Recurse -Force
          $readmeB = Join-Path $folderB 'README.txt'
          $readmeText = [IO.File]::ReadAllText($readmeB) -replace '^BenchBar for Windows \S+ ', 'BenchBar for Windows 99.0.0 '
          [IO.File]::WriteAllText($readmeB, $readmeText, (New-Object Text.UTF8Encoding $false))
          foreach ($f in Get-ChildItem $folderB -Recurse -File) {
            if ($f.Name -eq 'SHA256SUMS') { continue }
            # a trailing line break: a PE file still runs, JSON and scripts stay valid
            [IO.File]::AppendAllText($f.FullName, "`r`n")
          }
          Write-Sums $folderB

          function Get-Snapshot([string]$Dir) {
            $snap = @{}
            foreach ($f in Get-ChildItem $Dir -Recurse -File -Force) {
              $snap[$f.FullName.Substring($Dir.Length + 1)] = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            }
            return $snap
          }

          $env:BENCHBAR_TEST_DOTNET_DESKTOP = '1'
          foreach ($hostExe in @('powershell.exe', 'pwsh')) {
            Write-Host "--- installer under $hostExe"
            $fresh = Join-Path $env:RUNNER_TEMP "localappdata-held-$hostExe"
            New-Item -ItemType Directory -Force $fresh | Out-Null
            $env:LOCALAPPDATA = $fresh
            $installDir = Join-Path $fresh 'Programs\BenchBar'

            & $hostExe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $folderA 'install.ps1') -Yes
            if ($LASTEXITCODE -ne 0) { throw "installing version A exited with $LASTEXITCODE" }
            $before = Get-Snapshot $installDir

            # the file the tester held; README.txt when this build has no tray app
            $heldRel = 'BenchBar.Tray.Core.dll'
            if (-not (Test-Path (Join-Path $installDir $heldRel))) { $heldRel = 'README.txt' }
            $handle = [System.IO.File]::Open((Join-Path $installDir $heldRel), 'Open', 'Read', 'Read')
            try {
              $said = (& $hostExe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $folderB 'install.ps1') -Yes 2>&1 | Out-String)
              $code = $LASTEXITCODE
            } finally {
              $handle.Dispose()
            }
            Write-Host $said
            if ($code -eq 0) { throw "the update to B succeeded with $heldRel held open" }
            if ($said -notmatch [regex]::Escape($heldRel)) { throw "the failure does not name $heldRel" }
            if ($said -notmatch 'Nothing was changed') { throw 'the failure does not say that nothing was changed' }
            if ($said -match 'restarted with the new version') { throw 'a failed update claims the new version' }
            $after = Get-Snapshot $installDir
            $extra = @($after.Keys | Where-Object { -not $before.ContainsKey($_) })
            $lost = @($before.Keys | Where-Object { -not $after.ContainsKey($_) })
            $differ = @($before.Keys | Where-Object { $after.ContainsKey($_) -and $after[$_] -ne $before[$_] })
            if ($extra.Count -gt 0) { throw "left behind by the failed update: $($extra -join ', ')" }
            if ($lost.Count -gt 0) { throw "missing after the failed update: $($lost -join ', ')" }
            if ($differ.Count -gt 0) { throw "not version A any more: $($differ -join ', ')" }
            Write-Host "all $($before.Count) files are still version A"

            # with the handle closed the same update works, and every file is B
            & $hostExe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $folderB 'install.ps1') -Yes
            if ($LASTEXITCODE -ne 0) { throw "the update to B exited with $LASTEXITCODE after the handle was closed" }
            $rootB = (Resolve-Path $folderB).Path
            foreach ($f in Get-ChildItem $rootB -Recurse -File) {
              $rel = $f.FullName.Substring($rootB.Length + 1)
              if ($rel -eq 'SHA256SUMS') { continue }
              $installed = Join-Path $installDir $rel
              if (-not (Test-Path $installed)) { throw "$rel is missing after the update to B" }
              if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne (Get-FileHash $f.FullName -Algorithm SHA256).Hash) { throw "$rel is not version B" }
            }
            $old = @(Get-ChildItem $installDir -Recurse -File -Filter '*.old')
            if ($old.Count -gt 0) { throw "backups left after a successful update: $($old.Name -join ', ')" }

            & $hostExe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $folderB 'install.ps1') -Uninstall -Yes
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Uninstall exited with $LASTEXITCODE" }
          }
          Remove-Item Env:BENCHBAR_TEST_DOTNET_DESKTOP
          $global:LASTEXITCODE = 0

  release:
    name: Attach to the draft release
    needs: [version, package, installer-test, tray-arm64]
    if: needs.version.outputs.release == 'true'
    # ubuntu: waiting for the Mac draft costs almost nothing there
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # id-token and attestations are for the build provenance step, and only
    # this job has them
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release-windows-attach-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      WAIT_FOR_DRAFT: ${{ github.event_name == 'push' || inputs.wait_for_draft == true }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          merge-multiple: true
          path: dist

      # install.ps1 of the tag goes into the checksums, so `benchbar.exe
      # self-update` can check the installer it runs against them
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}
          path: tag-src
          sparse-checkout: install.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Write the combined checksums file
        run: |
          # not named *SHA256SUMS: install.sh picks the first asset ending in that
          $sums = "dist/benchbar-windows-$env:VERSION-SHA256SUMS.txt"
          $lines = foreach ($zip in Get-ChildItem dist -Filter 'benchbar-windows-*.zip' | Sort-Object Name) {
            '{0}  {1}' -f (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $zip.Name
          }
          if (@($lines).Count -ne 2) { throw "expected 2 zips (amd64, arm64), found $(@($lines).Count)" }
          # the zips must be the ones the package jobs hashed
          foreach ($one in Get-ChildItem dist -Filter 'sums-*.txt') {
            $want = (Get-Content $one.FullName -Raw).Trim()
            if ($lines -notcontains $want) { throw "$($one.Name) does not match the zip on disk: $want" }
          }
          # the installer of this tag: benchbar.exe self-update downloads install.ps1 from
          # the tag and compares its SHA256 with this line before it runs it
          $installer = Join-Path $PWD 'tag-src/install.ps1'
          if (-not (Test-Path $installer)) { throw "install.ps1 is not in the checkout of v$env:VERSION" }
          $lines = @($lines) + ('{0}  install.ps1' -f (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant())
          [IO.File]::WriteAllText((Join-Path $PWD $sums), (($lines -join "`n") + "`n"), (New-Object Text.UTF8Encoding $false))
          Get-Content $sums

      # `gh attestation verify benchbar-windows-VERSION-ARCH.zip -R askysh/benchbar`
      # checks a download against this. pinned by commit (v4.2.2)
      - name: Attest the build provenance of both zips
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/benchbar-windows-*.zip
            dist/benchbar-windows-${{ needs.version.outputs.version }}-SHA256SUMS.txt

      - name: Find or create the draft release, upload, update the notes
        run: |
          $tag = "v$env:VERSION"
          $utf8 = New-Object Text.UTF8Encoding $false

          # the Windows paragraph, between markers so a re-run replaces it
          $records = @(Get-ChildItem dist -Filter 'signing-*.json' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json })
          $zipLines = @()
          foreach ($zip in Get-ChildItem dist -Filter 'benchbar-windows-*.zip' | Sort-Object Name) {
            $rec = $records | Where-Object { $zip.Name -like "*-$($_.arch).zip" } | Select-Object -First 1
            $what = 'benchbar.exe and the tray app'
            if ($rec -and -not $rec.tray) { $what = 'shim only: benchbar.exe, no tray app' }
            $zipLines += "- $($zip.Name) ($what)"
          }
          $allFiles = @($records | ForEach-Object { @($_.files) })
          $ownUnsigned = @($allFiles | Where-Object { $_.firstParty -and -not $_.signed } | ForEach-Object { $_.name } | Sort-Object -Unique)
          $otherUnsigned = @($allFiles | Where-Object { -not $_.firstParty -and -not $_.signed } | ForEach-Object { $_.name } | Sort-Object -Unique)
          $ownAll = @($allFiles | Where-Object { $_.firstParty } | ForEach-Object { $_.name } | Sort-Object -Unique)
          $signLines = @()
          if ($allFiles.Count -eq 0) {
            $signLines += 'Code signing status is not known for this build.'
          } elseif ($ownUnsigned.Count -eq 0 -and $otherUnsigned.Count -eq 0) {
            $signLines += 'Every .exe and .dll in the zips carries a valid signature.'
          } else {
            if ($ownUnsigned.Count -eq 0) {
              $signLines += "This project's own programs are signed ($($ownAll -join ', '))."
            } else {
              $signLines += "Not code signed yet: $($ownUnsigned -join ', '). Smart App Control blocks unsigned programs (the installer stops before it writes anything and says what to do). Without Smart App Control, Windows may ask you to confirm the first start of a program; the one line installer removes that question only when it can verify the zip's build provenance (gh installed and signed in)."
            }
            if ($otherUnsigned.Count -gt 0) {
              $signLines += "Third party files without a signature (not signed by this project): $($otherUnsigned -join ', ')."
            }
          }
          $block = @(
            '<!-- windows -->'
            '### Windows'
            ''
            'Install for the current user (needs WSL 2 with Ubuntu 24.04):'
            ''
            '```powershell'
            "& ([scriptblock]::Create((irm https://raw.githubusercontent.com/askysh/benchbar/v$env:VERSION/install.ps1))) -Version $env:VERSION"
            '```'
            ''
            'Downloads (each zip also holds README.txt and SHA256SUMS):'
            ''
            $zipLines
            "- benchbar-windows-$env:VERSION-SHA256SUMS.txt"
            ''
            "Check a download: ``gh attestation verify benchbar-windows-$env:VERSION-amd64.zip -R askysh/benchbar`` (build provenance), or compare its SHA256 with the sums file."
            ''
            ($signLines -join "`n`n")
            '<!-- /windows -->'
          ) | ForEach-Object { $_ }
          $blockText = $block -join "`n"

          # find the release (release.yml creates it). A tag push, and a run
          # auto-tag.yml started next to release.yml, wait for it: its macOS
          # job allows 120 minutes. A manual run needs it to exist.
          $rel = $null
          $waits = 0
          if ($env:WAIT_FOR_DRAFT -eq 'true') { $waits = 130 }
          for ($i = 0; $i -le $waits; $i++) {
            $out = gh release view $tag --json isDraft,body 2>$null
            if ($LASTEXITCODE -eq 0) { $rel = $out | ConvertFrom-Json; break }
            if ($i -lt $waits) { Write-Host "No release $tag yet (the Mac workflow creates it). Waiting 60 s ($($i + 1)/$waits)."; Start-Sleep -Seconds 60 }
          }

          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          $created = $false
          if ($null -eq $rel) {
            if ($env:WAIT_FOR_DRAFT -ne 'true') {
              Write-Host "::error::There is no release $tag. A manual run attaches to an existing draft: run release.yml for this tag first, then this workflow again."
              exit 1
            }
            Write-Host "::warning title=Draft created here::No release $tag appeared in 130 minutes, so this run created a draft with the Windows notes only. A later release.yml run will replace the notes (and this paragraph): re-run this workflow afterwards."
            [IO.File]::WriteAllText($notes, $blockText + "`n", $utf8)
            # a release candidate is a pre-release, as release.yml drafts it
            $pre = if ($env:VERSION -like '*-rc.*') { '--prerelease' } else { '--prerelease=false' }
            gh release create $tag --draft --title "BenchBar $env:VERSION" --target $env:GITHUB_SHA --notes-file $notes $pre
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
            $isDraft = $true
            $created = $true
          } else {
            $isDraft = [bool]$rel.isDraft
          }

          # A published release is immutable: fail, change nothing. On a draft a
          # file of the same name is deleted first, so nothing is overwritten
          # in place (no --clobber).
          if (-not $isDraft) {
            Write-Host "::error title=Release already published::Release $tag is published and immutable, so this run will not add or replace its files or edit its notes. To fix a release, delete nothing: cut a new version."
            exit 1
          }
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -like 'benchbar-windows-*' })
          $existing = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'gh release view (assets) failed' }
          foreach ($f in $files) {
            if ($existing -contains $f.Name) {
              gh release delete-asset $tag $f.Name --yes
              if ($LASTEXITCODE -ne 0) { throw "gh release delete-asset $($f.Name) failed" }
            }
          }
          gh release upload $tag ($files | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }

          if (-not $created) {
            $body = [string]$rel.body
            $start = $body.IndexOf('<!-- windows -->')
            $end = $body.IndexOf('<!-- /windows -->')
            if ($start -ge 0 -and $end -gt $start) {
              $new = $body.Substring(0, $start) + $blockText + $body.Substring($end + '<!-- /windows -->'.Length)
            } else {
              $new = $body.TrimEnd() + "`n`n" + $blockText + "`n"
            }
            [IO.File]::WriteAllText($notes, $new, $utf8)
            gh release edit $tag --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'gh release edit failed' }
          }
          Write-Host "::notice title=Windows assets::https://github.com/$env:GH_REPO/releases/tag/$tag (draft: review, then publish)"
