# Updates askysh/homebrew-tap when a release is published: the benchbar
# formula always, the benchbar-app cask only for a signed release (one with
# a Sparkle appcast). A pre-release (a release candidate, X.Y.Z-rc.N) leaves
# the tap alone: the job is skipped before it asks for the release
# environment, and a run by hand for a version with a suffix stops at once. Runs on publish, not in release.yml: a draft's asset
# URLs answer 404, so a formula merged before publishing breaks brew install.
#
# The formula and cask are rendered from packaging/homebrew with the sha256
# of the published files (checked against SHA256SUMS and their build
# provenance, gh attestation verify, first), put into a
# clone of the tap, checked with brew style and brew audit, installed and
# tested, then proposed as a pull request on the tap. The workflow stops
# there: a person reads the pull request and merges it (maintainers/releasing.md,
# "The Homebrew tap"). Nothing here merges, or turns on auto-merge.
# It closes the open tap pull requests of older benchbar versions: the new
# one replaces them. The tap's tests check only the files a pull request
# changes, so a Margin release at the same time does not block this one.
#
# Needs the HOMEBREW_TAP_TOKEN secret: a fine grained token with Contents
# and Pull requests write access to askysh/homebrew-tap only. Without it
# the run still checks everything and prints the files to copy by hand.
# The secret lives in the `release` environment, which accepts v* tags only
# and waits for the maintainer: a run for a published release has the tag as
# its ref; to redo one by hand, run the workflow on the tag (--ref vX.Y.Z).
# Only the last step sees the token. The tap is cloned without it, so no
# credential sits in the clone's .git/config while brew runs formula code.
name: Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published version (X.Y.Z) to put in the tap. A release candidate is refused"
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  tap:
    name: Formula and cask for askysh/homebrew-tap
    # A pre-release is skipped here, not in a step: a step would run only after
    # the maintainer approved the release environment for nothing.
    if: github.event_name != 'release' || !github.event.release.prerelease
    environment: release
    runs-on: macos-latest
    timeout-minutes: 30
    # attestations: read is for gh attestation verify
    permissions:
      contents: read
      attestations: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"; else v="${TAG_NAME#v}"; fi
          # the same pattern as scripts/check-version.sh; test-version-sources keeps them equal
          if ! [[ "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::'$v' is not a version (expected X.Y.Z or X.Y.Z-rc.N)"; exit 1
          fi
          # a suffix is a pre-release whatever GitHub says (a run by hand has no release event)
          case "$v" in *-rc.*) PRERELEASE=true ;; esac
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice title=Prerelease::v$v is a prerelease; the tap keeps the last release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.version.outputs.skip != 'true'
        with:
          ref: v${{ steps.version.outputs.version }}
          persist-credentials: false

      - name: Download and check the release files
        if: steps.version.outputs.skip != 'true'
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/release"
          gh release download "v$VERSION" --dir "$dir" \
            --pattern "benchbar-cli-${VERSION}.tar.gz" --pattern "BenchBar-${VERSION}.dmg" \
            --pattern SHA256SUMS --pattern appcast.xml
          cd "$dir"
          [ -f "benchbar-cli-${VERSION}.tar.gz" ] || { echo "::error::v$VERSION has no benchbar-cli-${VERSION}.tar.gz (releases before 0.7.0 have none)"; exit 1; }
          files="benchbar-cli-${VERSION}.tar.gz"
          signed=false
          if [ -f appcast.xml ] && [ -f "BenchBar-${VERSION}.dmg" ]; then signed=true; files="$files BenchBar-${VERSION}.dmg"; fi
          for f in $files; do
            want="$(awk -v f="$f" '$2 == f || $2 == "*" f || $2 == "./" f {print $1; exit}' SHA256SUMS)"
            have="$(shasum -a 256 "$f" | awk '{print $1}')"
            [ -n "$want" ] && [ "$want" = "$have" ] || { echo "::error::$f does not match SHA256SUMS (${want:-not listed}, file $have)"; exit 1; }
            echo "$f: sha256 $have, matches SHA256SUMS"
          done
          # The sums come from the same release as the files, so they prove
          # nothing about where the files were built. The attestation does:
          # release.yml attested these files and SHA256SUMS, and a formula
          # is rendered from files that verify only.
          # Releases before 0.9.0 have no attestation (the Mac files were first
          # attested then): a run by hand for one of them skips the check.
          IFS=. read -r major minor _ <<<"${VERSION%%-*}"
          if [ "$major" -eq 0 ] && [ "$minor" -lt 9 ]; then
            echo "::notice title=No build provenance check::v$VERSION is older than 0.9.0, the first release whose files are attested, so only SHA256SUMS was checked."
            files_to_verify=""
          else
            files_to_verify="$files SHA256SUMS"
          fi
          for f in $files_to_verify; do
            gh attestation verify "$f" -R askysh/benchbar --signer-workflow askysh/benchbar/.github/workflows/release.yml || {
              echo "::error::$f has no build provenance from askysh/benchbar (gh attestation verify failed); the formula is not rendered"; exit 1; }
          done
          [ "$signed" = "true" ] || echo "::notice title=Formula only::v$VERSION is not a signed release; the cask stays as it is."
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Clone the tap and render the formula and cask into it
        if: steps.version.outputs.skip != 'true'
        id: tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIR: ${{ steps.files.outputs.dir }}
          SIGNED: ${{ steps.files.outputs.signed }}
        run: |
          tap="$(brew --repository)/Library/Taps/askysh/homebrew-tap"
          git clone https://github.com/askysh/homebrew-tap.git "$tap" || brew tap-new --no-git askysh/tap
          # newer Homebrew loads formulae only from a tap marked as trusted
          if brew trust --help >/dev/null 2>&1; then brew trust askysh/tap; fi
          args=(--version "$VERSION" --cli "$DIR/benchbar-cli-${VERSION}.tar.gz")
          [ "$SIGNED" != "true" ] || args+=(--dmg "$DIR/BenchBar-${VERSION}.dmg")
          scripts/homebrew-render.sh "${args[@]}" "$tap"
          echo "path=$tap" >> "$GITHUB_OUTPUT"

      - name: brew style and brew audit
        if: steps.version.outputs.skip != 'true'
        env:
          SIGNED: ${{ steps.files.outputs.signed }}
        run: |
          brew style askysh/tap/benchbar
          brew audit --strict --online --formula askysh/tap/benchbar
          if [ "$SIGNED" = "true" ]; then
            brew style askysh/tap/benchbar-app
            brew audit --strict --online --cask askysh/tap/benchbar-app
          fi

      - name: Install, test and uninstall
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.files.outputs.signed }}
        run: |
          brew install askysh/tap/benchbar
          brew test askysh/tap/benchbar
          home="$(mktemp -d)"
          where="$(HOME="$home" "$(brew --prefix)/bin/benchbar" where --json)"
          echo "$where"
          case "$where" in *'"install":"homebrew"'*) ;; *) echo "::error::where --json does not say homebrew"; exit 1 ;; esac
          case "$where" in *"/Cellar/"*) echo "::error::where --json names a Cellar path"; exit 1 ;; esac
          if [ "$SIGNED" = "true" ]; then
            brew install --cask askysh/tap/benchbar-app
            got="$(defaults read /Applications/BenchBar.app/Contents/Info CFBundleShortVersionString)"
            [ "$got" = "$VERSION" ] || { echo "::error::the cask installed BenchBar $got, not $VERSION"; exit 1; }
            brew uninstall --cask askysh/tap/benchbar-app
          fi
          brew uninstall askysh/tap/benchbar
          [ ! -e "$(brew --prefix)/bin/benchbar" ] || { echo "::error::bin/benchbar is left after brew uninstall"; exit 1; }

      - name: Open the tap pull request (a person merges it)
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAP: ${{ steps.tap.outputs.path }}
        run: |
          cd "$TAP"
          if [ -z "$GH_TOKEN" ]; then
            for f in Formula/benchbar.rb Casks/benchbar-app.rb; do
              [ -f "$f" ] && { echo "::group::$f"; cat "$f"; echo "::endgroup::"; }
            done
            echo "::notice title=No pull request::Set HOMEBREW_TAP_TOKEN, or copy the files above into askysh/homebrew-tap."
            exit 0
          fi
          git add Formula Casks 2>/dev/null || git add Formula
          if git diff --cached --quiet; then
            echo "::notice title=Tap up to date::askysh/homebrew-tap already has $VERSION."
            exit 0
          fi
          branch="benchbar-${VERSION}"
          git checkout -b "$branch"
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -m "benchbar ${VERSION}"
          # the token is on this one command line only, never in the clone's config
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/askysh/homebrew-tap.git" "$branch"
          body="benchbar ${VERSION} from https://github.com/askysh/benchbar/releases/tag/v${VERSION}, rendered, audited and installed by the release's homebrew-tap workflow."
          gh pr view "$branch" --repo askysh/homebrew-tap >/dev/null 2>&1 \
            || gh pr create --repo askysh/homebrew-tap --base main --head "$branch" --title "benchbar ${VERSION}" --body "$body"
          url="$(gh pr view "$branch" --repo askysh/homebrew-tap --json url --jq .url)"
          # An open pull request for an older benchbar version is replaced by this one: close it.
          gh pr list --repo askysh/homebrew-tap --state open --json headRefName --jq '.[].headRefName' \
            | sed -n 's/^benchbar-\([0-9][0-9.]*\)$/\1/p' | while read -r old; do
                [ "$old" != "$VERSION" ] || continue
                newest="$(printf '%s\n%s\n' "$old" "$VERSION" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)"
                [ "$newest" = "$VERSION" ] || continue
                gh pr close "benchbar-$old" --repo askysh/homebrew-tap --delete-branch \
                  --comment "Replaced by $url (benchbar $VERSION)."
                echo "::notice title=Closed::the tap pull request for benchbar $old, replaced by $VERSION."
              done
          echo "::notice title=Tap pull request::$url is open. Read it and merge it, so brew install gets this version."
