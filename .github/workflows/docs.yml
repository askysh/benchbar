# The docs site, https://benchbar.akashmishra.com: Astro Starlight in
# site/, built from the markdown in docs/ (plus ROADMAP.md and
# CONTRIBUTING.md at the root) with Bun.
#
# The site describes the last release, so it is built and deployed from main
# only (docs/DECISIONS.md, "Docs process"). Work lands on next-release, and
# a feature's pages go live with the release that has the feature.
#
# Every pull request to next-release (or main) gets a "Docs build" check: the
# docs test (the generated reference tables against the code), the build and a
# link check over the built site, so a broken page or link shows in the pull
# request and not after the release. A small "changes" job skips the build
# when nothing that feeds the docs changed: a skipped job counts as a pass
# for a required check, where a workflow filtered out by "paths" would leave
# the check pending forever (docs/DECISIONS.md, "0.5.5: docs site").
#
# A push to main that changed the docs builds again and deploys to GitHub
# Pages. This is the official Astro Pages workflow with its steps spelled
# out, so the install can be "bun install --frozen-lockfile" and the link
# check can run before anything is uploaded.
#
# Once a week (a schedule runs on main) the "External links" job checks every
# http(s) link of the built site, which the pull request check skips so that
# somebody else's outage never blocks a pull request.
name: Docs

on:
  pull_request:
    branches: [next-release, main]
  push:
    branches: [main]
  schedule:
    # Mondays, off the hour
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Docs changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'site/**'
              - 'ROADMAP.md'
              - 'CONTRIBUTING.md'
              - '.github/workflows/docs.yml'
              # the sources of the generated reference tables
              - 'lib/frappe-local/commands.sh'
              - 'lib/frappe-local/labs.sh'
              - 'lib/frappe-local/mcp.py'
              - 'scripts/docs-reference.py'
              - 'tests/test-docs.sh'

  build:
    name: Docs build
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      # the whole history: "Last updated" on each page comes from git log
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # the docs' promises to the CLI: a heading per doctor check id, only
      # flags that --help knows, frontmatter on every page
      - name: Docs test (tests/test-docs.sh)
        working-directory: .
        run: bash tests/run-tests.sh test-docs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/.bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: bun run build

      - name: Link check
        run: bun run linkcheck

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Weekly, on main: the external links. A failure here is a notice to fix a
  # link, never a block on a pull request.
  external-links:
    name: External links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # its own group: a slow weekly check must not hold up a deploy of main
    concurrency:
      group: docs-external-links
      cancel-in-progress: true
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/.bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: bun run build

      - name: Check the external links
        run: bun run linkcheck:external
