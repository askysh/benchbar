# Snapshots: render the popover, the BenchBar window, its panes and sheets to
# PNG with fixture data, in light and dark, and upload them as an artifact.
# A way to look at the UI without a Mac at hand.
#
# SnapshotTests.swift is off unless ~/Library/Caches/BenchBarSnapshots
# exists, so this workflow creates the folder and runs only that suite. No
# network and no real CLI: the tests answer every CLI call from
# macos/BenchBarTests/Fixtures.
#
#   gh workflow run snapshots.yml -f ref=<branch>   render a branch, tag or commit
#   label a pull request "snapshots"                 render its head and its base
#   gh run download <run id>                         fetch the PNGs
#
# The label works before this file is on main (workflow_dispatch needs the
# file on the default branch). Remove and add the label again to re-render.
#
# Known artifact: offscreen renders have no key window, so the selected
# sidebar row and the selected tab draw solid black.
name: Snapshots

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to render (empty for the ref the workflow runs on)
        required: false
        default: ''
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  render:
    name: Render snapshots (${{ matrix.side }})
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'snapshots'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # a labeled pull request renders before (base) and after (head)
        side: ${{ fromJSON(github.event_name == 'pull_request' && '["head","base"]' || '["ref"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.side == 'base' && github.event.pull_request.base.sha || matrix.side == 'head' && github.event.pull_request.head.sha || inputs.ref || github.sha }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate the project
        run: cd macos && xcodegen generate --quiet

      - name: Commit of the render
        id: rev
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # the same call as the Swift tests step in ci.yml, limited to the
      # snapshot suite
      - name: Render
        run: |
          set -o pipefail
          mkdir -p ~/Library/Caches/BenchBarSnapshots
          mkdir -p macos/build
          xcodebuild -project macos/BenchBar.xcodeproj -scheme BenchBar -configuration Debug \
            -derivedDataPath macos/build/DerivedData -destination 'platform=macOS,arch=arm64' \
            -only-testing:BenchBarTests/SnapshotTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= test 2>&1 | tee macos/build/test.log | \
            grep -E '^(✔|✘)|Test run with|error:|\*\* TEST' || true
          ls ~/Library/Caches/BenchBarSnapshots
          grep -q -E '\*\* TEST SUCCEEDED \*\*|Test run with [0-9]+ tests? passed' macos/build/test.log

      - name: Annotate compiler errors and failed tests
        if: failure()
        run: scripts/ci-annotate.sh macos/build/build.log macos/build/test.log

      - name: Upload the PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ matrix.side }}-${{ steps.rev.outputs.sha }}
          path: ~/Library/Caches/BenchBarSnapshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-test-log-${{ matrix.side }}-${{ steps.rev.outputs.sha }}
          path: macos/build/test.log
          if-no-files-found: ignore
