# Snapshots: render the popover, the BenchBar window, its panes and sheets with
# fixture data, in light and dark, and compare each render with its reference
# image in macos/BenchBarTests/Snapshots/macos<N>/ (SnapshotCompare.swift:
# 2 pt per pixel, a small share of changed pixels is allowed).
#
# It runs on every pull request that changes macos/, so a layout, colour or
# text change in a view shows as a red check here, and the PNGs of the failed
# run are the artifact. ci.yml leaves this suite out so it runs once.
#
#   gh workflow run snapshots.yml -f ref=<branch>               render a branch, tag or commit
#   gh workflow run snapshots.yml -f ref=<branch> -f record=true  also write the references
#   gh run download <run id>                                    fetch the PNGs
#
# References are per macOS major version, because the system draws controls
# differently from one release to the next. When this runner's version has
# none (a new runner image), the job records them instead of failing and
# uploads them as the artifact "references": commit that folder.
#
# Offscreen only: nothing opens on a screen. The docs images
# (DocsSnapshotTests) open a window, so they stay off here.
name: Snapshots

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to render (empty for the ref the workflow runs on)
        required: false
        default: ''
      record:
        description: Write the reference images instead of comparing, and upload them
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'macos/**'
      - '.github/workflows/snapshots.yml'

permissions:
  contents: read

concurrency:
  group: snapshots-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  render:
    name: Render and compare snapshots
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate the project
        run: cd macos && xcodegen generate --quiet

      - name: Commit of the render
        id: rev
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # a marker file in the output folder, because xcodebuild passes no
      # environment variables to a hosted test
      - name: Compare or record
        id: mode
        env:
          RECORD: ${{ inputs.record }}
        run: |
          major="$(sw_vers -productVersion | cut -d. -f1)"
          mkdir -p ~/Library/Caches/BenchBarSnapshots
          if [ "$RECORD" = true ]; then
            touch ~/Library/Caches/BenchBarSnapshots/record
            echo "record=true" >> "$GITHUB_OUTPUT"
          elif [ ! -d "macos/BenchBarTests/Snapshots/macos${major}" ]; then
            touch ~/Library/Caches/BenchBarSnapshots/record
            echo "record=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No reference images for macOS ${major}: recording them. Commit the artifact 'references' to macos/BenchBarTests/Snapshots/."
          fi

      # the same call as the Swift tests step in ci.yml, limited to the
      # snapshot suites
      - name: Render
        run: |
          set -o pipefail
          mkdir -p macos/build
          xcodebuild -project macos/BenchBar.xcodeproj -scheme BenchBar -configuration Debug \
            -derivedDataPath macos/build/DerivedData -destination 'platform=macOS,arch=arm64' \
            -only-testing:BenchBarTests/SnapshotTests -only-testing:BenchBarTests/SnapshotCompareTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= test 2>&1 | tee macos/build/test.log | \
            grep -E '^(✔|✘)|Test run with|error:|\*\* TEST' || true
          ls ~/Library/Caches/BenchBarSnapshots
          grep -q -E '\*\* TEST SUCCEEDED \*\*|Test run with [0-9]+ tests? passed' macos/build/test.log

      - name: Annotate compiler errors and failed tests
        if: failure()
        run: scripts/ci-annotate.sh macos/build/build.log macos/build/test.log

      - name: Upload the PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-${{ steps.rev.outputs.sha }}
          path: ~/Library/Caches/BenchBarSnapshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload the references
        if: always() && steps.mode.outputs.record == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: references
          path: macos/BenchBarTests/Snapshots
          if-no-files-found: error
          retention-days: 30

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-test-log-${{ steps.rev.outputs.sha }}
          path: macos/build/test.log
          if-no-files-found: ignore
