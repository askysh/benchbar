# Weekly updates for the Actions in .github/workflows, the Swift
# packages of the app and the docs site's packages (site/, bun). The CLI
# is plain bash with no packages to update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /macos
    schedule:
      interval: weekly
  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
