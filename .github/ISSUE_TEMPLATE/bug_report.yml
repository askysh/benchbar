name: Bug report (macOS or Linux)
description: Something in the CLI or the Mac app does not work as it should on macOS or Ubuntu.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search the open issues first.
        A security problem goes through a private report instead: see SECURITY.md.
        On Windows, use the Windows form or Report a Bug in the tray.
  - type: input
    id: macos
    attributes:
      label: OS version
      description: "macOS: Apple menu, About This Mac. Say Intel if it is not Apple Silicon. Ubuntu: `lsb_release -ds`."
      placeholder: macOS 26.1, Apple Silicon, or Ubuntu 24.04.3 LTS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: benchbar --version
      placeholder: benchbar 0.8.1
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - The one line installer (install.sh)
        - A git clone (macOS)
        - Linux (git clone)
        - A release download of the app
        - Built from source (scripts/macos-install-local.sh)
        - Other
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile
      description: v15-lts, v16-lts or the name of a team profile. `benchbar status` shows it. Say "not set yet" if you have no bench yet.
      placeholder: v16-lts
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or clicked, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The benchbar report zip
      description: |
        Run `benchbar report` and drag the zip it writes into this box. It holds
        no passwords, keys, paths or names; `benchbar report --print` shows what is in it.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: benchbar doctor
      description: The output of `benchbar doctor` (add `--bench-dir PATH` for a bench other than the default).
      render: text
    validations:
      required: true
  - type: checkboxes
    id: ai
    attributes:
      label: Written by you
      options:
        - label: I wrote this report in my own words (CONTRIBUTING.md, AI assisted contributions).
          required: true
