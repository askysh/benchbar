# The steps both Mac build jobs of release.yml share before they build:
# Xcode, tools, the CLI tests and the version check. It reads no secret.
name: Release prepare
description: Select Xcode, install the tools, run the CLI tests and check the version.
inputs:
  version:
    description: The version being built (X.Y.Z or X.Y.Z-rc.N)
    required: true
  prerelease:
    description: "true for a release candidate (a suffix on the version): no changelog section is needed and fragments may remain"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        # the version the macos-26 image has as its default today. A signed
        # release must build the same way a week later, so this is bumped on
        # purpose (with the snapshot references, ci.yml and snapshots.yml say
        # the same), never by "latest"
        xcode-version: '26.6'

    # XcodeGen and shellcheck at the versions and sha256 of
    # scripts/ci-install-tool.sh: no Homebrew formula that moves, and no
    # cache that a CI run on another branch could have written
    - name: Install tools
      shell: bash
      run: |
        scripts/ci-install-tool.sh xcodegen
        scripts/ci-install-tool.sh shellcheck

    - name: CLI tests
      shell: bash
      run: /bin/bash tests/run-tests.sh

    # One script for every place the version lives, shared with auto-tag.yml
    # and tests/test-version-sources.sh. A release also needs its changelog
    # section and no fragment left; a release candidate, and an ad hoc test
    # build from a branch, need no fragment folded.
    - name: Check the version in every place
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PRERELEASE: ${{ inputs.prerelease }}
        IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      run: |
        # fragments may wait on a branch (an ad hoc test build) and in a candidate
        if [ "$PRERELEASE" = "true" ] || [ "$IS_TAG" != "true" ]; then
          scripts/check-version.sh "$VERSION"
        else
          scripts/check-version.sh --folded "$VERSION"
        fi
