# The steps both Mac build jobs of release.yml share before they build:
# Xcode, tools, the CLI tests and the version check. It reads no secret.
name: Release prepare
description: Select Xcode, install the tools, run the CLI tests and check the version.
inputs:
  version:
    description: The version being built (X.Y.Z)
    required: true
runs:
  using: composite
  steps:
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Cache Homebrew downloads
      uses: actions/cache@v6
      with:
        path: ~/Library/Caches/Homebrew
        key: brew-${{ runner.os }}-${{ runner.arch }}-xcodegen
        restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

    - name: Install tools
      shell: bash
      run: brew install xcodegen shellcheck

    - name: CLI tests
      shell: bash
      run: /bin/bash tests/run-tests.sh

    - name: Check the version against project.yml, benchbar and the CHANGELOG
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        project="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' macos/project.yml | head -n 1)"
        [ "$project" = "$VERSION" ] || { echo "::error::tag says $VERSION but macos/project.yml says $project"; exit 1; }
        cli="$(sed -n 's/^FL_VERSION="\([^"]*\)"$/\1/p' benchbar | head -n 1)"
        [ "$cli" = "$VERSION" ] || { echo "::error::tag says $VERSION but FL_VERSION in benchbar says $cli"; exit 1; }
        grep -q "^## ${VERSION} " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## ${VERSION} ' section"; exit 1; }
        echo "version $VERSION matches project.yml and benchbar, and has a CHANGELOG section"
